<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bad Apple!!: the applening</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #111;
    color: #eee;
    font-family: system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 1.5rem;
  }
  h1 {
    font-size: 1.4rem;
    font-weight: 600;
    margin-bottom: 1rem;
    letter-spacing: 0.02em;
  }
  .controls {
    display: flex;
    gap: 1.5rem;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 1rem;
    padding: 0.75rem 1.25rem;
    background: #1a1a1a;
    border-radius: 8px;
    border: 1px solid #333;
  }
  .control-group {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  label {
    font-size: 0.85rem;
    color: #aaa;
    white-space: nowrap;
  }
  input[type="range"] {
    width: 10rem;
    accent-color: #888;
  }
  .block-value {
    font-variant-numeric: tabular-nums;
    min-width: 2.5rem;
    text-align: right;
    font-size: 0.85rem;
  }
  button {
    background: #333;
    color: #eee;
    border: 1px solid #555;
    padding: 0.35rem 1rem;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.85rem;
  }
  button:hover { background: #444; }
  .transport {
    display: flex;
    gap: 0.75rem;
    align-items: center;
    margin-bottom: 1rem;
    padding: 0.5rem 1.25rem;
    background: #1a1a1a;
    border-radius: 8px;
    border: 1px solid #333;
    width: fit-content;
  }
  .transport button { min-width: 3rem; }
  #scrub {
    width: 20rem;
    accent-color: #888;
  }
  #timeDisplay {
    font-size: 0.8rem;
    font-variant-numeric: tabular-nums;
    color: #aaa;
    min-width: 7rem;
    text-align: center;
  }
  .canvas-wrap {
    position: relative;
    background: #000;
    border-radius: 4px;
    overflow: hidden;
    line-height: 0;
  }
  .color-controls {
    display: flex;
    gap: 1rem;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 1rem;
    padding: 0.75rem 1.25rem;
    background: #1a1a1a;
    border-radius: 8px;
    border: 1px solid #333;
  }
  .color-controls input[type="range"] {
    width: 7rem;
  }
  .color-controls input[type="range"]:disabled {
    opacity: 0.3;
  }
  .color-controls input[type="checkbox"] {
    accent-color: #e66;
  }
  .delta-label { color: #e55; font-weight: 600; }
  .delta-check { accent-color: #e55; }
  .delta-params { display: flex; gap: 0.75rem; align-items: center; }
  .delta-params input[type="range"] { width: 5rem; }
  .delta-params input[type="range"]:disabled { opacity: 0.3; }
  [data-tip] {
    position: relative;
  }
  [data-tip]:hover::after {
    content: attr(data-tip);
    position: absolute;
    bottom: calc(100% + 6px);
    left: 50%;
    transform: translateX(-50%);
    background: #222;
    color: #ccc;
    font-size: 0.75rem;
    font-weight: 400;
    padding: 0.3rem 0.6rem;
    border-radius: 4px;
    border: 1px solid #444;
    white-space: nowrap;
    z-index: 10;
    pointer-events: none;
  }
  .color-value {
    font-variant-numeric: tabular-nums;
    min-width: 2rem;
    text-align: right;
    font-size: 0.85rem;
  }
  .canvas-wrap { aspect-ratio: 4/3; }
  .spinner {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    z-index: 1;
  }
  .spinner::after {
    content: '';
    width: 2rem;
    height: 2rem;
    border: 3px solid #333;
    border-top-color: #888;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  canvas { display: block; max-width: 90vw; }
  video { display: none; }
</style>
</head>
<body>

<h1>Bad Apple!!: the applening</h1>

<div class="controls">
  <div class="control-group">
    <label for="blockSize">Block size:</label>
    <input type="range" id="blockSize" min="1" max="64" value="1">
    <span class="block-value" id="blockValue">1</span>
  </div>
</div>

<div class="color-controls">
  <div class="control-group" data-tip="Colorize pixels using the effect sliders below">
    <label><input type="checkbox" id="colorToggle"> Color</label>
  </div>
  <div class="control-group" data-tip="Swap which pixels get colored — dark instead of bright">
    <label><input type="checkbox" id="invertToggle" disabled> Invert</label>
  </div>
  <div class="control-group" data-tip="Pixels that change flash red→violet then fade out">
    <label class="delta-label"><input type="checkbox" id="deltaToggle" class="delta-check"> Linger</label>
  </div>
  <div class="delta-params">
    <label for="deltaThreshold" data-tip="How much a pixel must change to trigger">Threshold</label>
    <input type="range" id="deltaThreshold" min="5" max="100" value="30" disabled>
    <label for="deltaSpeed" data-tip="How fast the color sweeps red→violet">Speed</label>
    <input type="range" id="deltaSpeed" min="20" max="200" value="100" disabled>
  </div>
  <div class="control-group" data-tip="Hue shifts with audio amplitude — quiet is blue, loud is red">
    <label for="audioSlider">Audio</label>
    <input type="range" id="audioSlider" min="0" max="100" value="0" disabled>
    <span class="color-value" id="audioValue">0%</span>
  </div>
  <div class="control-group" data-tip="Hue cycles through the spectrum over the video duration">
    <label for="cycleSlider">Cycle</label>
    <input type="range" id="cycleSlider" min="0" max="100" value="0" disabled>
    <span class="color-value" id="cycleValue">0%</span>
  </div>
  <div class="control-group" data-tip="Hue varies by angle from center — rotates during playback">
    <label for="pinwheelSlider">Pinwheel</label>
    <input type="range" id="pinwheelSlider" min="0" max="100" value="0" disabled>
    <span class="color-value" id="pinwheelValue">0%</span>
  </div>
  <div class="control-group" data-tip="Desaturates color on bass beats for a pulsing effect">
    <label for="beatSlider">Beat</label>
    <input type="range" id="beatSlider" min="0" max="100" value="0" disabled>
    <span class="color-value" id="beatValue">0%</span>
  </div>
</div>

<div class="transport">
  <button id="playBtn">Play</button>
  <button id="pauseBtn">Pause</button>
  <button id="stopBtn">Stop</button>
  <input type="range" id="scrub" min="0" max="1000" value="0">
  <span id="timeDisplay">0:00 / 0:00</span>
</div>

<div class="canvas-wrap">
  <div class="spinner" id="spinner"></div>
  <canvas id="canvas"></canvas>
</div>

<video id="video" playsinline></video>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const blockSlider = document.getElementById('blockSize');
const blockValue = document.getElementById('blockValue');
const playBtn = document.getElementById('playBtn');
const pauseBtn = document.getElementById('pauseBtn');
const stopBtn = document.getElementById('stopBtn');
const scrub = document.getElementById('scrub');
const timeDisplay = document.getElementById('timeDisplay');
const colorToggle = document.getElementById('colorToggle');
const invertToggle = document.getElementById('invertToggle');
const audioSlider = document.getElementById('audioSlider');
const cycleSlider = document.getElementById('cycleSlider');
const pinwheelSlider = document.getElementById('pinwheelSlider');
const audioValueEl = document.getElementById('audioValue');
const cycleValueEl = document.getElementById('cycleValue');
const pinwheelValueEl = document.getElementById('pinwheelValue');
const beatSlider = document.getElementById('beatSlider');
const beatValueEl = document.getElementById('beatValue');
const deltaToggle = document.getElementById('deltaToggle');
const deltaThresholdSlider = document.getElementById('deltaThreshold');
const deltaSpeedSlider = document.getElementById('deltaSpeed');

let blockSize = 1;
let animId = null;
let isScrubbing = false;

// Color state
let colorEnabled = false;
let invertEnabled = false;
let audioWeight = 0;
let timeWeight = 0;
let spatialWeight = 0;
let beatWeight = 0;

// Beat detection state
let beatEnergy = 0;
let prevBassEnergy = 0;
let beatDecay = 0;
const BEAT_DECAY_RATE = 0.92;
const BEAT_THRESHOLD = 1.4;

// Delta mode state
let deltaEnabled = false;
let deltaThreshold = 30;
let deltaSweepDuration = 1.0;
let deltaFadeDuration = 0.5;
let deltaPrevFrame = null;
let deltaChangeAge = null;
let deltaPrevSw = 0;
let deltaPrevSh = 0;
let deltaLastTimestamp = 0;

// Audio state
let audioCtx = null;
let analyser = null;
let freqData = null;
let audioSourceConnected = false;

// Color constants
const SATURATION = 0.95;

// Spatial map cache
let spatialMapCache = null;
let spatialMapW = 0;
let spatialMapH = 0;

// Offscreen canvas for downsampling
const small = document.createElement('canvas');
const sctx = small.getContext('2d');

function loadVideo() {
  video.src = 'r2/full_video.mp4';
  video.load();
}

function fmtTime(s) {
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return m + ':' + String(sec).padStart(2, '0');
}

function updateTime() {
  const cur = fmtTime(video.currentTime);
  const dur = fmtTime(video.duration || 0);
  timeDisplay.textContent = cur + ' / ' + dur;
  if (!isScrubbing && video.duration) {
    scrub.value = (video.currentTime / video.duration) * 1000;
  }
}

function hsvToRgb(h, s, v) {
  h = ((h % 1) + 1) % 1;
  const i = (h * 6) | 0;
  const f = h * 6 - i;
  const p = v * (1 - s);
  const q = v * (1 - f * s);
  const t = v * (1 - (1 - f) * s);
  let r, g, b;
  switch (i % 6) {
    case 0: r = v; g = t; b = p; break;
    case 1: r = q; g = v; b = p; break;
    case 2: r = p; g = v; b = t; break;
    case 3: r = p; g = q; b = v; break;
    case 4: r = t; g = p; b = v; break;
    case 5: r = v; g = p; b = q; break;
  }
  return [(r * 255) | 0, (g * 255) | 0, (b * 255) | 0];
}

function initAudio() {
  if (audioCtx) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return;
  }
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 2048;
  analyser.smoothingTimeConstant = 0.6;
  freqData = new Uint8Array(analyser.frequencyBinCount);
  if (!audioSourceConnected) {
    const source = audioCtx.createMediaElementSource(video);
    source.connect(analyser);
    analyser.connect(audioCtx.destination);
    audioSourceConnected = true;
  }
}

function getAudioAmplitudeHue() {
  if (!analyser || !freqData) return 0.65;
  analyser.getByteFrequencyData(freqData);
  let sum = 0;
  for (let i = 0; i < freqData.length; i++) sum += freqData[i];
  const avg = sum / freqData.length / 255;
  // Quiet → blue/cyan (0.65), loud → red (0.0)
  return 0.65 * (1 - avg);
}

function getTimeCycleHue() {
  if (!video.duration) return 0;
  return (video.currentTime / video.duration) % 1.0;
}

function updateBeat() {
  if (!analyser || !freqData || beatWeight === 0) { beatDecay = 0; return; }
  analyser.getByteFrequencyData(freqData);
  const binHz = audioCtx.sampleRate / analyser.fftSize;
  const bassMaxBin = Math.min(Math.floor(200 / binHz), freqData.length - 1);
  let bassEnergy = 0;
  for (let i = 1; i <= bassMaxBin; i++) bassEnergy += freqData[i];
  bassEnergy /= bassMaxBin;
  if (prevBassEnergy > 0 && bassEnergy > prevBassEnergy * BEAT_THRESHOLD && bassEnergy > 30) {
    beatDecay = 1.0;
  } else {
    beatDecay *= BEAT_DECAY_RATE;
  }
  prevBassEnergy = bassEnergy;
}

function getSpatialMap(sw, sh) {
  if (!spatialMapCache || spatialMapW !== sw || spatialMapH !== sh) {
    spatialMapCache = new Float32Array(sw * sh);
    spatialMapW = sw;
    spatialMapH = sh;
    const cx = (sw - 1) / 2;
    const cy = (sh - 1) / 2;
    for (let y = 0; y < sh; y++) {
      for (let x = 0; x < sw; x++) {
        spatialMapCache[y * sw + x] = Math.atan2(y - cy, x - cx) / (2 * Math.PI) + 0.5;
      }
    }
  }
  return spatialMapCache;
}

function getPinwheelHue(baseAngle) {
  const spin = (video.currentTime || 0) * 0.15;
  return ((baseAngle * 6 + spin) % 1.0 + 1.0) % 1.0;
}

function resetDeltaBuffers(sw, sh) {
  deltaPrevFrame = new Uint8Array(sw * sh);
  deltaChangeAge = new Float32Array(sw * sh);
  deltaChangeAge.fill(10.0);
  deltaPrevSw = sw;
  deltaPrevSh = sh;
  deltaLastTimestamp = 0;
  captureBaselineFrame(sw, sh);
}

function captureBaselineFrame(sw, sh) {
  const w = video.videoWidth;
  const h = video.videoHeight;
  if (!w || !h) return;
  small.width = sw;
  small.height = sh;
  sctx.drawImage(video, 0, 0, sw, sh);
  const img = sctx.getImageData(0, 0, sw, sh);
  const d = img.data;
  for (let i = 0; i < sw * sh; i++) {
    deltaPrevFrame[i] = (d[i * 4] * 0.299 + d[i * 4 + 1] * 0.587 + d[i * 4 + 2] * 0.114) | 0;
  }
}

function applyDeltaEffect(now) {
  const w = video.videoWidth;
  const h = video.videoHeight;
  if (!w || !h) return;
  const bs = Math.max(blockSize, 1);
  const sw = Math.ceil(w / bs);
  const sh = Math.ceil(h / bs);

  if (!deltaPrevFrame || deltaPrevSw !== sw || deltaPrevSh !== sh) {
    resetDeltaBuffers(sw, sh);
  }

  // Compute delta time, clamped
  let dt = 0;
  if (deltaLastTimestamp > 0) {
    dt = Math.min((now - deltaLastTimestamp) / 1000, 0.1);
  }
  deltaLastTimestamp = now;

  // Read small canvas grayscale and compare
  const sImg = sctx.getImageData(0, 0, sw, sh);
  const sd = sImg.data;
  let anyActive = false;
  const totalDuration = deltaSweepDuration + deltaFadeDuration;

  for (let i = 0; i < sw * sh; i++) {
    const gray = (sd[i * 4] * 0.299 + sd[i * 4 + 1] * 0.587 + sd[i * 4 + 2] * 0.114) | 0;
    const diff = Math.abs(gray - deltaPrevFrame[i]);
    if (diff > deltaThreshold) {
      deltaChangeAge[i] = 0;
    } else {
      deltaChangeAge[i] += dt;
    }
    deltaPrevFrame[i] = gray;
    if (deltaChangeAge[i] < totalDuration) anyActive = true;
  }

  // Early exit if nothing is active
  if (!anyActive) return;

  // Apply colors on main canvas
  const imgData = ctx.getImageData(0, 0, w, h);
  const data = imgData.data;

  for (let py = 0; py < h; py++) {
    const by = Math.min((py / bs) | 0, sh - 1);
    for (let px = 0; px < w; px++) {
      const bx = Math.min((px / bs) | 0, sw - 1);
      const bi = by * sw + bx;
      const age = deltaChangeAge[bi];
      if (age >= totalDuration) continue;

      const pi = (py * w + px) * 4;

      let hue, sat, val;
      if (age < deltaSweepDuration) {
        hue = (age / deltaSweepDuration) * 0.83;
        sat = 1.0;
        val = 1.0;
      } else {
        hue = 0.83;
        const fadeProgress = (age - deltaSweepDuration) / deltaFadeDuration;
        sat = 1.0 - fadeProgress;
        val = 1.0 - fadeProgress;
      }

      const rgb = hsvToRgb(hue, sat, val);
      data[pi] = rgb[0];
      data[pi + 1] = rgb[1];
      data[pi + 2] = rgb[2];
    }
  }
  ctx.putImageData(imgData, 0, 0);
}

function applyColorEffects(targetCtx, w, h) {
  const imgData = targetCtx.getImageData(0, 0, w, h);
  const data = imgData.data;
  const aHue = audioWeight > 0 ? getAudioAmplitudeHue() : 0;
  const tHue = timeWeight > 0 ? getTimeCycleHue() : 0;
  const sMap = spatialWeight > 0 ? getSpatialMap(w, h) : null;
  const hueWeight = audioWeight + timeWeight + spatialWeight;
  if (hueWeight === 0) return;
  const sat = SATURATION * (1 - beatWeight * (1 - beatDecay));

  for (let i = 0; i < data.length; i += 4) {
    const brightness = (data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114);
    const isBright = brightness > 128;
    if (invertEnabled ? isBright : !isBright) continue;
    const px = (i / 4) | 0;
    let hue = 0;
    if (audioWeight > 0) hue += aHue * audioWeight;
    if (timeWeight > 0) hue += tHue * timeWeight;
    if (spatialWeight > 0) hue += getPinwheelHue(sMap[px]) * spatialWeight;
    hue = (hue / hueWeight) % 1.0;
    const rgb = hsvToRgb(hue, sat, 1.0);
    data[i] = rgb[0];
    data[i + 1] = rgb[1];
    data[i + 2] = rgb[2];
  }
  targetCtx.putImageData(imgData, 0, 0);
}

function drawCurrentFrame(now) {
  const w = video.videoWidth;
  const h = video.videoHeight;
  if (!w || !h) return;
  const bs = blockSize;
  const needColor = colorEnabled && !deltaEnabled && (audioWeight > 0 || timeWeight > 0 || spatialWeight > 0);
  if (needColor) updateBeat();
  if (deltaEnabled) {
    // Delta mode always uses the small-canvas path for block comparison
    const sw = Math.ceil(w / Math.max(bs, 1));
    const sh = Math.ceil(h / Math.max(bs, 1));
    small.width = sw;
    small.height = sh;
    sctx.drawImage(video, 0, 0, sw, sh);
    if (bs > 1) {
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(small, 0, 0, w, h);
    } else {
      ctx.drawImage(video, 0, 0, w, h);
    }
    applyDeltaEffect(now);
  } else if (bs <= 1 && !needColor) {
    ctx.drawImage(video, 0, 0, w, h);
  } else if (bs <= 1) {
    ctx.drawImage(video, 0, 0, w, h);
    applyColorEffects(ctx, w, h);
  } else {
    const sw = Math.ceil(w / bs);
    const sh = Math.ceil(h / bs);
    small.width = sw;
    small.height = sh;
    sctx.drawImage(video, 0, 0, sw, sh);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(small, 0, 0, w, h);
    if (needColor) applyColorEffects(ctx, w, h);
  }
}

video.addEventListener('loadedmetadata', () => {
  document.getElementById('spinner').remove();
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  ctx.imageSmoothingEnabled = false;
  updateTime();
  drawCurrentFrame();
  video.play().catch(e => console.warn('Autoplay blocked:', e));
});

video.addEventListener('play', () => {
  if (animId) cancelAnimationFrame(animId);
  renderLoop();
});

video.addEventListener('ended', () => {
  if (animId) cancelAnimationFrame(animId);
  updateTime();
});

video.addEventListener('timeupdate', updateTime);

// Transport controls
playBtn.addEventListener('click', () => {
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  video.play();
});
pauseBtn.addEventListener('click', () => video.pause());
stopBtn.addEventListener('click', () => {
  video.pause();
  video.currentTime = 0;
  if (deltaEnabled) {
    const bs = Math.max(blockSize, 1);
    const sw = Math.ceil(video.videoWidth / bs);
    const sh = Math.ceil(video.videoHeight / bs);
    if (sw > 0 && sh > 0) resetDeltaBuffers(sw, sh);
  }
  updateTime();
  drawCurrentFrame();
});

// Scrub bar
scrub.addEventListener('input', () => {
  isScrubbing = true;
  if (video.duration) {
    video.currentTime = (scrub.value / 1000) * video.duration;
    if (deltaEnabled) {
      const bs = Math.max(blockSize, 1);
      const sw = Math.ceil(video.videoWidth / bs);
      const sh = Math.ceil(video.videoHeight / bs);
      if (sw > 0 && sh > 0) resetDeltaBuffers(sw, sh);
    }
    drawCurrentFrame();
    updateTime();
  }
});
scrub.addEventListener('change', () => {
  isScrubbing = false;
});

blockSlider.addEventListener('input', () => {
  blockSize = parseInt(blockSlider.value);
  blockValue.textContent = blockSize;
  if (deltaEnabled) {
    const bs = Math.max(blockSize, 1);
    const sw = Math.ceil(video.videoWidth / bs);
    const sh = Math.ceil(video.videoHeight / bs);
    if (sw > 0 && sh > 0) resetDeltaBuffers(sw, sh);
  }
});

// Color controls
colorToggle.addEventListener('change', () => {
  colorEnabled = colorToggle.checked;
  audioSlider.disabled = !colorEnabled;
  cycleSlider.disabled = !colorEnabled;
  pinwheelSlider.disabled = !colorEnabled;
  beatSlider.disabled = !colorEnabled;
  invertToggle.disabled = !colorEnabled;
  if (colorEnabled) {
    deltaToggle.checked = false;
    deltaEnabled = false;
    deltaThresholdSlider.disabled = true;
    deltaSpeedSlider.disabled = true;
    initAudio();
  }
});

audioSlider.addEventListener('input', () => {
  audioWeight = audioSlider.value / 100;
  audioValueEl.textContent = audioSlider.value + '%';
});
cycleSlider.addEventListener('input', () => {
  timeWeight = cycleSlider.value / 100;
  cycleValueEl.textContent = cycleSlider.value + '%';
});
pinwheelSlider.addEventListener('input', () => {
  spatialWeight = pinwheelSlider.value / 100;
  pinwheelValueEl.textContent = pinwheelSlider.value + '%';
});
beatSlider.addEventListener('input', () => {
  beatWeight = beatSlider.value / 100;
  beatValueEl.textContent = beatSlider.value + '%';
});
invertToggle.addEventListener('change', () => {
  invertEnabled = invertToggle.checked;
});

deltaToggle.addEventListener('change', () => {
  deltaEnabled = deltaToggle.checked;
  deltaThresholdSlider.disabled = !deltaEnabled;
  deltaSpeedSlider.disabled = !deltaEnabled;
  if (deltaEnabled) {
    colorToggle.checked = false;
    colorEnabled = false;
    audioSlider.disabled = true;
    cycleSlider.disabled = true;
    pinwheelSlider.disabled = true;
    beatSlider.disabled = true;
    invertToggle.disabled = true;
    const bs = Math.max(blockSize, 1);
    const sw = Math.ceil(video.videoWidth / bs);
    const sh = Math.ceil(video.videoHeight / bs);
    if (sw > 0 && sh > 0) resetDeltaBuffers(sw, sh);
  }
});

deltaThresholdSlider.addEventListener('input', () => {
  deltaThreshold = parseInt(deltaThresholdSlider.value);
});

deltaSpeedSlider.addEventListener('input', () => {
  const val = parseInt(deltaSpeedSlider.value);
  deltaSweepDuration = val / 100;
  deltaFadeDuration = deltaSweepDuration * 0.5;
});

function renderLoop(timestamp) {
  if (video.paused || video.ended) return;
  drawCurrentFrame(timestamp);
  animId = requestAnimationFrame(renderLoop);
}
