<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bad Apple!!: the applening</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #111;
    color: #eee;
    font-family: system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 1.5rem;
  }
  h1 {
    font-size: 1.4rem;
    font-weight: 600;
    margin-bottom: 1rem;
    letter-spacing: 0.02em;
  }
  .controls {
    display: flex;
    gap: 1.5rem;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 1rem;
    padding: 0.75rem 1.25rem;
    background: #1a1a1a;
    border-radius: 8px;
    border: 1px solid #333;
  }
  .control-group {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  label {
    font-size: 0.85rem;
    color: #aaa;
    white-space: nowrap;
  }
  input[type="range"] {
    width: 10rem;
    accent-color: #888;
  }
  .block-value {
    font-variant-numeric: tabular-nums;
    min-width: 2.5rem;
    text-align: right;
    font-size: 0.85rem;
  }
  button {
    background: #333;
    color: #eee;
    border: 1px solid #555;
    padding: 0.35rem 1rem;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.85rem;
  }
  button:hover { background: #444; }
  .transport {
    display: flex;
    gap: 0.75rem;
    align-items: center;
    margin-bottom: 1rem;
    padding: 0.5rem 1.25rem;
    background: #1a1a1a;
    border-radius: 8px;
    border: 1px solid #333;
    width: fit-content;
  }
  .transport button { min-width: 3rem; }
  #scrub {
    width: 20rem;
    accent-color: #888;
  }
  #timeDisplay {
    font-size: 0.8rem;
    font-variant-numeric: tabular-nums;
    color: #aaa;
    min-width: 7rem;
    text-align: center;
  }
  .canvas-wrap {
    position: relative;
    background: #000;
    border-radius: 4px;
    overflow: hidden;
    line-height: 0;
  }
  .effect-sections { display:flex; flex-direction:column; gap:0.5rem; margin-bottom:1rem; max-width:42rem; width:100%; }
  .effect-section { background:#1a1a1a; border-radius:8px; border:1px solid #333; padding:0.6rem 1rem; border-left:3px solid #555; }
  .color-section { border-left-color:#e66; }
  .linger-section { border-left-color:#e55; }
  .fireworks-section { border-left-color:#d4a017; }
  .section-header { display:flex; align-items:center; gap:0.75rem; }
  .section-header label { font-size:0.9rem; font-weight:600; color:#ddd; cursor:pointer; }
  .section-header .linger-toggle { color:#e55; }
  .section-header .fireworks-toggle { color:#d4a017; }
  .section-body { padding-left:1.5rem; margin-top:0.35rem; }
  .section-body.disabled { opacity:0.35; pointer-events:none; }
  .sub-row { display:flex; align-items:center; gap:0.5rem; flex-wrap:wrap; margin-bottom:0.25rem; }
  .sub-row input[type="range"] { width:5rem; }
  .sub-row input[type="checkbox"] { accent-color:#e66; }
  .linger-section input[type="checkbox"] { accent-color:#e55; }
  .fireworks-section input[type="checkbox"] { accent-color:#d4a017; }
  [data-tip] {
    position: relative;
  }
  [data-tip]:hover::after {
    content: attr(data-tip);
    position: absolute;
    bottom: calc(100% + 6px);
    left: 50%;
    transform: translateX(-50%);
    background: #222;
    color: #ccc;
    font-size: 0.75rem;
    font-weight: 400;
    padding: 0.3rem 0.6rem;
    border-radius: 4px;
    border: 1px solid #444;
    white-space: nowrap;
    z-index: 10;
    pointer-events: none;
  }
  .color-value {
    font-variant-numeric: tabular-nums;
    min-width: 2rem;
    text-align: right;
    font-size: 0.85rem;
  }
  .canvas-wrap { aspect-ratio: 4/3; }
  .spinner {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    z-index: 1;
  }
  .spinner::after {
    content: '';
    width: 2rem;
    height: 2rem;
    border: 3px solid #333;
    border-top-color: #888;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  canvas { display: block; max-width: 90vw; }
  video { display: none; }
</style>
</head>
<body>

<h1>Bad Apple!!: the applening</h1>

<div class="controls">
  <div class="control-group">
    <label for="blockSize">Block size:</label>
    <input type="range" id="blockSize" min="1" max="64" value="1">
    <span class="block-value" id="blockValue">1</span>
  </div>
  <div class="control-group">
    <label for="blurSize">Blur:</label>
    <input type="range" id="blurSize" min="0" max="64" value="0">
    <span class="block-value" id="blurValue">0</span>
  </div>
</div>

<div class="effect-sections">
  <div class="effect-section color-section">
    <div class="section-header">
      <label data-tip="Colorize pixels using the effect sliders below"><input type="checkbox" id="colorToggle"> Color</label>
    </div>
    <div class="section-body disabled" id="colorBody">
      <div class="sub-row">
        <label data-tip="Swap which pixels get colored — dark instead of bright"><input type="checkbox" id="invertToggle"> Invert</label>
        <label for="audioSlider" data-tip="Hue shifts with audio amplitude — quiet is blue, loud is red">Audio</label>
        <input type="range" id="audioSlider" min="0" max="100" value="0">
        <span class="color-value" id="audioValue">0%</span>
      </div>
    </div>
  </div>

  <div class="effect-section linger-section">
    <div class="section-header">
      <label class="linger-toggle" data-tip="Pixels that change flash red to violet then fade out"><input type="checkbox" id="deltaToggle"> Linger</label>
    </div>
    <div class="section-body disabled" id="lingerBody">
      <div class="sub-row">
        <label for="deltaSpeed" data-tip="How fast the color sweeps red to violet">Speed</label>
        <input type="range" id="deltaSpeed" min="20" max="200" value="120">
        <label for="deltaRange" data-tip="How far through the spectrum the sweep goes (0 = red only, 100 = full)">Range</label>
        <input type="range" id="deltaRange" min="0" max="100" value="100">
      </div>
    </div>
  </div>

  <div class="effect-section fireworks-section">
    <div class="section-header">
      <label class="fireworks-toggle" data-tip="Particles burst from pixels that change"><input type="checkbox" id="fireworksToggle"> Fireworks</label>
    </div>
    <div class="section-body disabled" id="fireworksBody">
      <div class="sub-row">
        <label for="fireworksIntensity" data-tip="Number of particles per burst">Intensity</label>
        <input type="range" id="fireworksIntensity" min="1" max="20" value="8">
        <label for="fireworksSpread" data-tip="How far particles fly">Spread</label>
        <input type="range" id="fireworksSpread" min="10" max="500" value="200">
      </div>
    </div>
  </div>
</div>

<div class="transport">
  <button id="playBtn">Play</button>
  <button id="pauseBtn">Pause</button>
  <button id="stopBtn">Stop</button>
  <input type="range" id="scrub" min="0" max="1000" value="0">
  <span id="timeDisplay">0:00 / 0:00</span>
</div>

<div class="canvas-wrap">
  <div class="spinner" id="spinner"></div>
  <canvas id="canvas"></canvas>
</div>

<video id="video" playsinline></video>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const blockSlider = document.getElementById('blockSize');
const blockValue = document.getElementById('blockValue');
const blurSlider = document.getElementById('blurSize');
const blurValueEl = document.getElementById('blurValue');
const playBtn = document.getElementById('playBtn');
const pauseBtn = document.getElementById('pauseBtn');
const stopBtn = document.getElementById('stopBtn');
const scrub = document.getElementById('scrub');
const timeDisplay = document.getElementById('timeDisplay');
const colorToggle = document.getElementById('colorToggle');
const invertToggle = document.getElementById('invertToggle');
const audioSlider = document.getElementById('audioSlider');
const audioValueEl = document.getElementById('audioValue');
const deltaToggle = document.getElementById('deltaToggle');
const deltaSpeedSlider = document.getElementById('deltaSpeed');
const deltaRangeSlider = document.getElementById('deltaRange');
const colorBody = document.getElementById('colorBody');
const lingerBody = document.getElementById('lingerBody');
const fireworksBody = document.getElementById('fireworksBody');
const fireworksToggle = document.getElementById('fireworksToggle');
const fireworksIntensitySlider = document.getElementById('fireworksIntensity');
const fireworksSpreadSlider = document.getElementById('fireworksSpread');

let blockSize = 1;
let blurRadius = 0;
let animId = null;
let isScrubbing = false;

// Color state
let colorEnabled = false;
let invertEnabled = false;
let audioWeight = 0;

// Delta mode state
let deltaEnabled = false;
let deltaSweepDuration = 1.0;
let deltaFadeDuration = 0.5;
let deltaPrevFrame = null;
let deltaChangeAge = null;
let deltaPrevSw = 0;
let deltaPrevSh = 0;
let deltaLastTimestamp = 0;
let deltaRange = 0.83;

// Fireworks state
let fireworksEnabled = false;
let fireworksIntensity = 8;
let fireworksSpread = 200;
let fwLastTimestamp = 0;
const FW_MAX = 8000;
const FW_LIFETIME = 1.5;
const FW_GRAVITY = 80;
const fwX = new Float32Array(FW_MAX);
const fwY = new Float32Array(FW_MAX);
const fwVx = new Float32Array(FW_MAX);
const fwVy = new Float32Array(FW_MAX);
const fwHue = new Float32Array(FW_MAX);
const fwAge = new Float32Array(FW_MAX);
const fwAlive = new Uint8Array(FW_MAX);
let fwCount = 0;
let fwNextSlot = 0;

// Audio state
let audioCtx = null;
let analyser = null;
let freqData = null;
let audioSourceConnected = false;

// Color constants
const SATURATION = 0.95;

// Offscreen canvas for downsampling
const small = document.createElement('canvas');
const sctx = small.getContext('2d');

function loadVideo() {
  video.src = 'r2/full_video.mp4';
  video.load();
}

function fmtTime(s) {
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return m + ':' + String(sec).padStart(2, '0');
}

function updateTime() {
  const cur = fmtTime(video.currentTime);
  const dur = fmtTime(video.duration || 0);
  timeDisplay.textContent = cur + ' / ' + dur;
  if (!isScrubbing && video.duration) {
    scrub.value = (video.currentTime / video.duration) * 1000;
  }
}

function hsvToRgb(h, s, v) {
  h = ((h % 1) + 1) % 1;
  const i = (h * 6) | 0;
  const f = h * 6 - i;
  const p = v * (1 - s);
  const q = v * (1 - f * s);
  const t = v * (1 - (1 - f) * s);
  let r, g, b;
  switch (i % 6) {
    case 0: r = v; g = t; b = p; break;
    case 1: r = q; g = v; b = p; break;
    case 2: r = p; g = v; b = t; break;
    case 3: r = p; g = q; b = v; break;
    case 4: r = t; g = p; b = v; break;
    case 5: r = v; g = p; b = q; break;
  }
  return [(r * 255) | 0, (g * 255) | 0, (b * 255) | 0];
}

function initAudio() {
  if (audioCtx) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return;
  }
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 2048;
  analyser.smoothingTimeConstant = 0.6;
  freqData = new Uint8Array(analyser.frequencyBinCount);
  if (!audioSourceConnected) {
    const source = audioCtx.createMediaElementSource(video);
    source.connect(analyser);
    analyser.connect(audioCtx.destination);
    audioSourceConnected = true;
  }
}

function getAudioAmplitudeHue() {
  if (!analyser || !freqData) return 0.65;
  analyser.getByteFrequencyData(freqData);
  let sum = 0;
  for (let i = 0; i < freqData.length; i++) sum += freqData[i];
  const avg = sum / freqData.length / 255;
  // Quiet -> blue/cyan (0.65), loud -> red (0.0)
  return 0.65 * (1 - avg);
}

function resetDeltaBuffers(sw, sh) {
  deltaPrevFrame = new Uint8Array(sw * sh);
  deltaChangeAge = new Float32Array(sw * sh);
  deltaChangeAge.fill(10.0);
  deltaPrevSw = sw;
  deltaPrevSh = sh;
  deltaLastTimestamp = 0;
  captureBaselineFrame(sw, sh);
}

function captureBaselineFrame(sw, sh) {
  const w = video.videoWidth;
  const h = video.videoHeight;
  if (!w || !h) return;
  small.width = sw;
  small.height = sh;
  sctx.drawImage(video, 0, 0, sw, sh);
  const img = sctx.getImageData(0, 0, sw, sh);
  const d = img.data;
  for (let i = 0; i < sw * sh; i++) {
    deltaPrevFrame[i] = (d[i * 4] * 0.299 + d[i * 4 + 1] * 0.587 + d[i * 4 + 2] * 0.114) | 0;
  }
}

function applyColorEffects(targetCtx, w, h) {
  const imgData = targetCtx.getImageData(0, 0, w, h);
  const data = imgData.data;
  if (audioWeight === 0) return;
  const hue = getAudioAmplitudeHue();
  const sat = SATURATION;

  for (let i = 0; i < data.length; i += 4) {
    const brightness = (data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114);
    const isBright = brightness > 128;
    if (!isBright && !invertEnabled) continue;
    const finalHue = (!isBright && invertEnabled) ? (hue + 0.5) % 1.0 : hue;
    const rgb = hsvToRgb(finalHue, sat, 1.0);
    data[i] = rgb[0];
    data[i + 1] = rgb[1];
    data[i + 2] = rgb[2];
  }
  targetCtx.putImageData(imgData, 0, 0);
}

function detectChangedBlocks(now, sw, sh) {
  if (!deltaPrevFrame || deltaPrevSw !== sw || deltaPrevSh !== sh) {
    resetDeltaBuffers(sw, sh);
  }

  // Compute delta time, clamped
  let dt = 0;
  if (deltaLastTimestamp > 0) {
    dt = Math.min((now - deltaLastTimestamp) / 1000, 0.1);
  }
  deltaLastTimestamp = now;

  // Read small canvas grayscale and compare
  const sImg = sctx.getImageData(0, 0, sw, sh);
  const sd = sImg.data;
  let anyActive = false;
  const totalDuration = deltaSweepDuration + deltaFadeDuration;

  for (let i = 0; i < sw * sh; i++) {
    const gray = (sd[i * 4] * 0.299 + sd[i * 4 + 1] * 0.587 + sd[i * 4 + 2] * 0.114) | 0;
    const diff = Math.abs(gray - deltaPrevFrame[i]);
    if (diff > 30) {
      deltaChangeAge[i] = 0;
    } else {
      deltaChangeAge[i] += dt;
    }
    deltaPrevFrame[i] = gray;
    if (deltaChangeAge[i] < totalDuration) anyActive = true;
  }

  return anyActive;
}

function applyLingerOverlay(w, h) {
  const bs = Math.max(blockSize, 1);
  const sw = deltaPrevSw;
  const sh = deltaPrevSh;
  if (!sw || !sh || !deltaChangeAge) return;

  const totalDuration = deltaSweepDuration + deltaFadeDuration;

  // Check if anything is active
  let anyActive = false;
  for (let i = 0; i < sw * sh; i++) {
    if (deltaChangeAge[i] < totalDuration) { anyActive = true; break; }
  }
  if (!anyActive) return;

  const imgData = ctx.getImageData(0, 0, w, h);
  const data = imgData.data;

  for (let py = 0; py < h; py++) {
    const by = Math.min((py / bs) | 0, sh - 1);
    for (let px = 0; px < w; px++) {
      const bx = Math.min((px / bs) | 0, sw - 1);
      const bi = by * sw + bx;
      const age = deltaChangeAge[bi];
      if (age >= totalDuration) continue;

      const pi = (py * w + px) * 4;

      let hue, sat, val;
      if (age < deltaSweepDuration) {
        hue = (age / deltaSweepDuration) * deltaRange;
        sat = 1.0;
        val = 1.0;
      } else {
        hue = deltaRange;
        const fadeProgress = (age - deltaSweepDuration) / deltaFadeDuration;
        sat = 1.0 - fadeProgress;
        val = 1.0 - fadeProgress;
      }

      const rgb = hsvToRgb(hue, sat, val);
      data[pi] = rgb[0];
      data[pi + 1] = rgb[1];
      data[pi + 2] = rgb[2];
    }
  }
  ctx.putImageData(imgData, 0, 0);
}

function fwSpawn(cx, cy, hue, count, spreadMag) {
  for (let j = 0; j < count; j++) {
    const slot = fwNextSlot;
    if (fwAlive[slot]) {
      fwCount--;
    }
    const angle = Math.random() * Math.PI * 2;
    const speed = (0.5 + Math.random() * 0.5) * spreadMag;
    fwX[slot] = cx;
    fwY[slot] = cy;
    fwVx[slot] = Math.cos(angle) * speed;
    fwVy[slot] = Math.sin(angle) * speed;
    fwHue[slot] = hue;
    fwAge[slot] = 0;
    fwAlive[slot] = 1;
    fwCount++;
    fwNextSlot = (fwNextSlot + 1) % FW_MAX;
  }
}

function fwUpdate(dt) {
  for (let i = 0; i < FW_MAX; i++) {
    if (!fwAlive[i]) continue;
    fwVy[i] += FW_GRAVITY * dt;
    fwX[i] += fwVx[i] * dt;
    fwY[i] += fwVy[i] * dt;
    fwAge[i] += dt;
    if (fwAge[i] >= FW_LIFETIME) {
      fwAlive[i] = 0;
      fwCount--;
    }
  }
}

function fwRender(w, h) {
  if (fwCount <= 0) return;
  const imgData = ctx.getImageData(0, 0, w, h);
  const data = imgData.data;
  for (let i = 0; i < FW_MAX; i++) {
    if (!fwAlive[i]) continue;
    const alpha = 1 - (fwAge[i] / FW_LIFETIME);
    const cx = Math.round(fwX[i]);
    const cy = Math.round(fwY[i]);
    const rgb = hsvToRgb(fwHue[i], 0.9, 1.0);
    for (let dy = -1; dy <= 1; dy++) {
      const py = cy + dy;
      if (py < 0 || py >= h) continue;
      for (let dx = -1; dx <= 1; dx++) {
        const px = cx + dx;
        if (px < 0 || px >= w) continue;
        const a = (dx === 0 && dy === 0) ? alpha : alpha * 0.5;
        const pi = (py * w + px) * 4;
        data[pi] = data[pi] + (rgb[0] - data[pi]) * a;
        data[pi + 1] = data[pi + 1] + (rgb[1] - data[pi + 1]) * a;
        data[pi + 2] = data[pi + 2] + (rgb[2] - data[pi + 2]) * a;
      }
    }
  }
  ctx.putImageData(imgData, 0, 0);
}

function fwSpawnFromChangedBlocks(w, h, sw, sh) {
  if (!deltaChangeAge) return;
  const bs = Math.max(blockSize, 1);
  let canvasData = null;
  if (colorEnabled) {
    canvasData = ctx.getImageData(0, 0, w, h).data;
  }
  // Collect edge blocks: changed blocks adjacent to unchanged blocks
  const edges = [];
  const totalDuration = deltaSweepDuration + deltaFadeDuration;
  for (let by = 0; by < sh; by++) {
    for (let bx = 0; bx < sw; bx++) {
      const bi = by * sw + bx;
      if (deltaChangeAge[bi] !== 0) continue;
      // Check if any neighbor is unchanged
      let isEdge = false;
      if (bx === 0 || bx === sw - 1 || by === 0 || by === sh - 1) {
        isEdge = true;
      } else {
        if (deltaChangeAge[bi - 1] >= totalDuration) isEdge = true;
        else if (deltaChangeAge[bi + 1] >= totalDuration) isEdge = true;
        else if (deltaChangeAge[bi - sw] >= totalDuration) isEdge = true;
        else if (deltaChangeAge[bi + sw] >= totalDuration) isEdge = true;
      }
      if (isEdge) edges.push(bi);
    }
  }
  if (edges.length === 0) return;
  // Sample a subset of edges to avoid overwhelming the pool
  const maxSpawnPoints = Math.min(edges.length, Math.ceil(FW_MAX / fireworksIntensity));
  const step = edges.length <= maxSpawnPoints ? 1 : edges.length / maxSpawnPoints;
  let spawned = 0;
  for (let ei = 0; ei < edges.length && spawned < FW_MAX; ei += step) {
    const bi = edges[ei | 0];
    const bx = bi % sw;
    const by = (bi / sw) | 0;
    const cx = Math.min((bx * bs + bs / 2) | 0, w - 1);
    const cy = Math.min((by * bs + bs / 2) | 0, h - 1);
    let hue;
    if (canvasData) {
      const pi = (cy * w + cx) * 4;
      const r = canvasData[pi], g = canvasData[pi + 1], b = canvasData[pi + 2];
      const max = Math.max(r, g, b), min = Math.min(r, g, b);
      if (max === min) {
        hue = 0.08 + Math.random() * 0.08;
      } else {
        const d = max - min;
        if (max === r) hue = ((g - b) / d + (g < b ? 6 : 0)) / 6;
        else if (max === g) hue = ((b - r) / d + 2) / 6;
        else hue = ((r - g) / d + 4) / 6;
      }
    } else {
      hue = 0.08 + Math.random() * 0.08;
    }
    fwSpawn(cx, cy, hue, fireworksIntensity, fireworksSpread);
    spawned += fireworksIntensity;
  }
}

function resetFireworks() {
  fwAlive.fill(0);
  fwCount = 0;
  fwNextSlot = 0;
}

function drawCurrentFrame(now) {
  const w = video.videoWidth;
  const h = video.videoHeight;
  if (!w || !h) return;
  const bs = blockSize;
  const needColor = colorEnabled && audioWeight > 0;
  const needDetection = deltaEnabled || fireworksEnabled;
  const bsMax = Math.max(bs, 1);
  const sw = Math.ceil(w / bsMax);
  const sh = Math.ceil(h / bsMax);

  // 1. Draw base frame; also prepare small canvas for change detection
  let smallReady = false;
  if (blurRadius > 0) ctx.filter = `blur(${blurRadius}px)`;
  if (bs > 1) {
    small.width = sw;
    small.height = sh;
    sctx.drawImage(video, 0, 0, sw, sh);
    smallReady = true;
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(small, 0, 0, w, h);
  } else {
    ctx.drawImage(video, 0, 0, w, h);
  }
  if (blurRadius > 0) ctx.filter = 'none';

  // 2. Draw video to small canvas for change detection (skip if already done above)
  if (needDetection && !smallReady) {
    small.width = sw;
    small.height = sh;
    sctx.drawImage(video, 0, 0, sw, sh);
  }

  // 3. Color effects on main canvas
  if (needColor) {
    applyColorEffects(ctx, w, h);
  }

  // 4. Change detection (shared by linger and fireworks)
  if (needDetection) {
    detectChangedBlocks(now || performance.now(), sw, sh);
  }

  // 5. Linger overlay
  if (deltaEnabled) {
    applyLingerOverlay(w, h);
  }

  // 6. Fireworks: spawn, update, render
  if (fireworksEnabled) {
    fwSpawnFromChangedBlocks(w, h, sw, sh);
    let fwDt = 0;
    if (now && fwLastTimestamp > 0) {
      fwDt = Math.min((now - fwLastTimestamp) / 1000, 0.1);
    }
    if (now) fwLastTimestamp = now;
    fwUpdate(fwDt);
    fwRender(w, h);
  }
}

video.addEventListener('loadedmetadata', () => {
  document.getElementById('spinner').remove();
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  ctx.imageSmoothingEnabled = false;
  updateTime();
  drawCurrentFrame();
  video.play().catch(e => console.warn('Autoplay blocked:', e));
});

video.addEventListener('play', () => {
  if (animId) cancelAnimationFrame(animId);
  renderLoop();
});

video.addEventListener('ended', () => {
  if (animId) cancelAnimationFrame(animId);
  updateTime();
});

video.addEventListener('timeupdate', updateTime);

// Transport controls
playBtn.addEventListener('click', () => {
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  video.play();
});
pauseBtn.addEventListener('click', () => video.pause());
stopBtn.addEventListener('click', () => {
  video.pause();
  video.currentTime = 0;
  if (deltaEnabled || fireworksEnabled) {
    const bs = Math.max(blockSize, 1);
    const sw = Math.ceil(video.videoWidth / bs);
    const sh = Math.ceil(video.videoHeight / bs);
    if (sw > 0 && sh > 0) resetDeltaBuffers(sw, sh);
  }
  resetFireworks();
  updateTime();
  drawCurrentFrame();
});

// Scrub bar
scrub.addEventListener('input', () => {
  isScrubbing = true;
  if (video.duration) {
    video.currentTime = (scrub.value / 1000) * video.duration;
    if (deltaEnabled || fireworksEnabled) {
      const bs = Math.max(blockSize, 1);
      const sw = Math.ceil(video.videoWidth / bs);
      const sh = Math.ceil(video.videoHeight / bs);
      if (sw > 0 && sh > 0) resetDeltaBuffers(sw, sh);
    }
    resetFireworks();
    drawCurrentFrame();
    updateTime();
  }
});
scrub.addEventListener('change', () => {
  isScrubbing = false;
});

blockSlider.addEventListener('input', () => {
  blockSize = parseInt(blockSlider.value);
  blockValue.textContent = blockSize;
  if (deltaEnabled || fireworksEnabled) {
    const bs = Math.max(blockSize, 1);
    const sw = Math.ceil(video.videoWidth / bs);
    const sh = Math.ceil(video.videoHeight / bs);
    if (sw > 0 && sh > 0) resetDeltaBuffers(sw, sh);
  }
  resetFireworks();
});

blurSlider.addEventListener('input', () => {
  blurRadius = parseInt(blurSlider.value);
  blurValueEl.textContent = blurRadius;
});

// Color controls
colorToggle.addEventListener('change', () => {
  colorEnabled = colorToggle.checked;
  if (colorEnabled) {
    colorBody.classList.remove('disabled');
    initAudio();
  } else {
    colorBody.classList.add('disabled');
  }
});

audioSlider.addEventListener('input', () => {
  audioWeight = audioSlider.value / 100;
  audioValueEl.textContent = audioSlider.value + '%';
});
invertToggle.addEventListener('change', () => {
  invertEnabled = invertToggle.checked;
});

// Linger controls
deltaToggle.addEventListener('change', () => {
  deltaEnabled = deltaToggle.checked;
  if (deltaEnabled) {
    lingerBody.classList.remove('disabled');
    const bs = Math.max(blockSize, 1);
    const sw = Math.ceil(video.videoWidth / bs);
    const sh = Math.ceil(video.videoHeight / bs);
    if (sw > 0 && sh > 0) resetDeltaBuffers(sw, sh);
  } else {
    lingerBody.classList.add('disabled');
  }
});

deltaSpeedSlider.addEventListener('input', () => {
  const val = parseInt(deltaSpeedSlider.value);
  deltaSweepDuration = (220 - val) / 100;
  deltaFadeDuration = deltaSweepDuration * 0.5;
});

deltaRangeSlider.addEventListener('input', () => {
  deltaRange = (parseInt(deltaRangeSlider.value) / 100) * 0.83;
});

// Fireworks controls
fireworksToggle.addEventListener('change', () => {
  fireworksEnabled = fireworksToggle.checked;
  if (fireworksEnabled) {
    fireworksBody.classList.remove('disabled');
    // Ensure change detection buffers exist
    const bs = Math.max(blockSize, 1);
    const sw = Math.ceil(video.videoWidth / bs);
    const sh = Math.ceil(video.videoHeight / bs);
    if (!deltaPrevFrame || deltaPrevSw !== sw || deltaPrevSh !== sh) {
      if (sw > 0 && sh > 0) resetDeltaBuffers(sw, sh);
    }
    fwLastTimestamp = 0;
  } else {
    fireworksBody.classList.add('disabled');
    resetFireworks();
  }
});

fireworksIntensitySlider.addEventListener('input', () => {
  fireworksIntensity = parseInt(fireworksIntensitySlider.value);
});

fireworksSpreadSlider.addEventListener('input', () => {
  fireworksSpread = parseInt(fireworksSpreadSlider.value);
});

function renderLoop(timestamp) {
  if (video.paused || video.ended) return;
  drawCurrentFrame(timestamp);
  animId = requestAnimationFrame(renderLoop);
}

// Auto-load on page open
loadVideo();
</script>

</body>
</html>
