<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const blockSlider = document.getElementById('blockSize');
const blockValue = document.getElementById('blockValue');
const blurSlider = document.getElementById('blurSize');
const blurValueEl = document.getElementById('blurValue');
const playBtn = document.getElementById('playBtn');
const pauseBtn = document.getElementById('pauseBtn');
const stopBtn = document.getElementById('stopBtn');
const scrub = document.getElementById('scrub');
const timeDisplay = document.getElementById('timeDisplay');
const deltaToggle = document.getElementById('deltaToggle');
const deltaSpeedSlider = document.getElementById('deltaSpeed');
const deltaColorStartEl = document.getElementById('deltaColorStart');
const deltaColorEndEl = document.getElementById('deltaColorEnd');
const lingerBody = document.getElementById('lingerBody');
const dustBody = document.getElementById('dustBody');
const dustToggle = document.getElementById('dustToggle');
const dustSpeedSlider = document.getElementById('dustSpeed');
const dustDensitySlider = document.getElementById('dustDensity');
const dustSpreadSlider = document.getElementById('dustSpread');
const dustColorStartEl = document.getElementById('dustColorStart');
const dustColorEndEl = document.getElementById('dustColorEnd');
const dustSensitivitySlider = document.getElementById('dustSensitivity');

let blockSize = 1;
let blurRadius = 0;
let animId = null;
let isScrubbing = false;


// Delta mode state
let deltaEnabled = false;
let deltaSweepDuration = 1.1;
let deltaFadeDuration = 0.55;
let deltaPrevFrame = null;
let deltaChangeAge = null;
let deltaPrevSw = 0;
let deltaPrevSh = 0;
let deltaLastTimestamp = 0;
let deltaHueStart = 0;       // red
let deltaHueEnd = 0.762;     // violet (#8800ff)

// Fireworks state
let dustEnabled = false;
let dustSpeed = 100;
let dustDensity = 100;
let dustSpread = 100;
let dustHueStart = hexToHue('#ffcc00');
let dustHueEnd = hexToHue('#ffcc00');
let dustThreshold = 5;       // 20 - sensitivity; 0 = any change, 20 = most selective
let dustChangeRate = null;     // Float32Array, same size as deltaChangeAge
let fwLastTimestamp = 0;
const FW_MAX = 12000;
const FW_LIFETIME = 2.0;
const FW_GRAVITY = 40;
const FW_SPLIT_AGE = 0.35;
const FW_MAX_GEN = 3;
const fwX = new Float32Array(FW_MAX);
const fwY = new Float32Array(FW_MAX);
const fwVx = new Float32Array(FW_MAX);
const fwVy = new Float32Array(FW_MAX);
const fwHue = new Float32Array(FW_MAX);
const fwAge = new Float32Array(FW_MAX);
const fwAlive = new Uint8Array(FW_MAX);
const fwGen = new Uint8Array(FW_MAX);
const fwSplit = new Uint8Array(FW_MAX);
let fwCount = 0;
let fwNextSlot = 0;

// Dust mode
let dustMode = 'classic'; // classic, trails, glow, outline, eruptions

// Trails mode state
let trailLength = 1.5;      // lifetime in seconds (slider / 100)
let trailSpeed = 120;
let trailDensity = 80;
let trailHueStart = hexToHue('#00ccff');
let trailHueEnd = hexToHue('#ff00cc');

// Glow mode state
let glowIntensity = 50;
let glowDecay = 30;
let glowHueStart = hexToHue('#ff4400');
let glowHueEnd = hexToHue('#ffcc00');
let glowBuffer = null;       // Float32Array, same size as change detection grid
let glowPrevSw = 0;
let glowPrevSh = 0;

// Outline mode state
let outlineSpeed = 100;
let outlineDensity = 100;
let outlineHueStart = hexToHue('#00ff88');
let outlineHueEnd = hexToHue('#00ff88');

// Eruptions mode state
let eruptThreshold = 30;
let eruptSize = 150;
let eruptHueStart = hexToHue('#ff2200');
let eruptHueEnd = hexToHue('#ffaa00');
let prevChangeCount = 0;


// Offscreen canvas for downsampling
const small = document.createElement('canvas');
const sctx = small.getContext('2d');

function loadVideo() {
  video.src = '/media/source/bad_apple.mp4';
  video.load();
}

function fmtTime(s) {
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return m + ':' + String(sec).padStart(2, '0');
}

function updateTime() {
  const cur = fmtTime(video.currentTime);
  const dur = fmtTime(video.duration || 0);
  timeDisplay.textContent = cur + ' / ' + dur;
  if (!isScrubbing && !video.seeking && video.duration) {
    scrub.value = (video.currentTime / video.duration) * 1000;
  }
}

function hexToHue(hex) {
  const r = parseInt(hex.slice(1, 3), 16) / 255;
  const g = parseInt(hex.slice(3, 5), 16) / 255;
  const b = parseInt(hex.slice(5, 7), 16) / 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b);
  if (max === min) return 0;
  const d = max - min;
  let h;
  if (max === r) h = ((g - b) / d + (g < b ? 6 : 0)) / 6;
  else if (max === g) h = ((b - r) / d + 2) / 6;
  else h = ((r - g) / d + 4) / 6;
  return h;
}

function hsvToRgb(h, s, v) {
  h = ((h % 1) + 1) % 1;
  const i = (h * 6) | 0;
  const f = h * 6 - i;
  const p = v * (1 - s);
  const q = v * (1 - f * s);
  const t = v * (1 - (1 - f) * s);
  let r, g, b;
  switch (i % 6) {
    case 0: r = v; g = t; b = p; break;
    case 1: r = q; g = v; b = p; break;
    case 2: r = p; g = v; b = t; break;
    case 3: r = p; g = q; b = v; break;
    case 4: r = t; g = p; b = v; break;
    case 5: r = v; g = p; b = q; break;
  }
  return [(r * 255) | 0, (g * 255) | 0, (b * 255) | 0];
}

function resetDeltaBuffers(sw, sh) {
  deltaPrevFrame = new Uint8Array(sw * sh);
  deltaChangeAge = new Float32Array(sw * sh);
  deltaChangeAge.fill(10.0);
  dustChangeRate = new Float32Array(sw * sh);
  deltaPrevSw = sw;
  deltaPrevSh = sh;
  deltaLastTimestamp = 0;
  captureBaselineFrame(sw, sh);
}

function captureBaselineFrame(sw, sh) {
  const w = video.videoWidth;
  const h = video.videoHeight;
  if (!w || !h) return;
  small.width = sw;
  small.height = sh;
  sctx.drawImage(video, 0, 0, sw, sh);
  const img = sctx.getImageData(0, 0, sw, sh);
  const d = img.data;
  for (let i = 0; i < sw * sh; i++) {
    deltaPrevFrame[i] = (d[i * 4] * 0.299 + d[i * 4 + 1] * 0.587 + d[i * 4 + 2] * 0.114) | 0;
  }
}

function detectChangedBlocks(now, sw, sh) {
  if (!deltaPrevFrame || deltaPrevSw !== sw || deltaPrevSh !== sh) {
    resetDeltaBuffers(sw, sh);
  }

  // Compute delta time, clamped
  let dt = 0;
  if (deltaLastTimestamp > 0) {
    dt = Math.min((now - deltaLastTimestamp) / 1000, 0.1);
  }
  deltaLastTimestamp = now;

  // Read small canvas grayscale and compare
  const sImg = sctx.getImageData(0, 0, sw, sh);
  const sd = sImg.data;
  let anyActive = false;
  const totalDuration = deltaSweepDuration + deltaFadeDuration;

  for (let i = 0; i < sw * sh; i++) {
    const gray = (sd[i * 4] * 0.299 + sd[i * 4 + 1] * 0.587 + sd[i * 4 + 2] * 0.114) | 0;
    const diff = Math.abs(gray - deltaPrevFrame[i]);
    if (diff > 30) {
      deltaChangeAge[i] = 0;
      if (dustChangeRate) dustChangeRate[i] = Math.min(dustChangeRate[i] + 1, 20);
    } else {
      deltaChangeAge[i] += dt;
      if (dustChangeRate) dustChangeRate[i] = Math.max(dustChangeRate[i] - dt * 3, 0);
    }
    deltaPrevFrame[i] = gray;
    if (deltaChangeAge[i] < totalDuration) anyActive = true;
  }

  return anyActive;
}

function applyLingerOverlay(w, h) {
  const bs = Math.max(blockSize, 1);
  const sw = deltaPrevSw;
  const sh = deltaPrevSh;
  if (!sw || !sh || !deltaChangeAge) return;

  const totalDuration = deltaSweepDuration + deltaFadeDuration;

  // Check if anything is active
  let anyActive = false;
  for (let i = 0; i < sw * sh; i++) {
    if (deltaChangeAge[i] < totalDuration) { anyActive = true; break; }
  }
  if (!anyActive) return;

  const imgData = ctx.getImageData(0, 0, w, h);
  const data = imgData.data;

  for (let py = 0; py < h; py++) {
    const by = Math.min((py / bs) | 0, sh - 1);
    for (let px = 0; px < w; px++) {
      const bx = Math.min((px / bs) | 0, sw - 1);
      const bi = by * sw + bx;
      const age = deltaChangeAge[bi];
      if (age >= totalDuration) continue;

      const pi = (py * w + px) * 4;

      let hue, sat, val;
      if (age < deltaSweepDuration) {
        const t = age / deltaSweepDuration;
        hue = deltaHueStart + t * (deltaHueEnd - deltaHueStart);
        sat = 1.0;
        val = 1.0;
      } else {
        hue = deltaHueEnd;
        const fadeProgress = (age - deltaSweepDuration) / deltaFadeDuration;
        sat = 1.0 - fadeProgress;
        val = 1.0 - fadeProgress;
      }

      const rgb = hsvToRgb(hue, sat, val);
      data[pi] = rgb[0];
      data[pi + 1] = rgb[1];
      data[pi + 2] = rgb[2];
    }
  }
  ctx.putImageData(imgData, 0, 0);
}

function fwSpawn(cx, cy, hue, count, spreadMag, gen) {
  gen = gen || 0;
  // Pick a dominant drift direction per spawn point for asymmetry
  const drift = Math.random() * Math.PI * 2;
  for (let j = 0; j < count; j++) {
    const slot = fwNextSlot;
    if (fwAlive[slot]) fwCount--;
    // Bias angle toward drift direction for non-circular clusters
    const angle = drift + (Math.random() - 0.5) * 3.5 + (Math.random() - 0.5) * 0.5;
    // Power-law speed: many slow, few fast — breaks the donut shape
    const r = Math.random();
    const speed = (0.1 + r * r * r * 1.5) * spreadMag;
    fwX[slot] = cx + (Math.random() - 0.5) * 4;
    fwY[slot] = cy + (Math.random() - 0.5) * 4;
    fwVx[slot] = Math.cos(angle) * speed;
    fwVy[slot] = Math.sin(angle) * speed;
    fwHue[slot] = hue + (Math.random() - 0.5) * 0.08;
    fwAge[slot] = 0;
    fwAlive[slot] = 1;
    fwGen[slot] = gen;
    fwSplit[slot] = 0;
    fwCount++;
    fwNextSlot = (fwNextSlot + 1) % FW_MAX;
  }
}

// Simple hash for position-based turbulence (no import needed)
function fwNoise(x, y) {
  const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
  return n - Math.floor(n);
}

function fwUpdate(dt) {
  const speedScale = dustSpeed / 100;
  const toSplit = [];
  for (let i = 0; i < FW_MAX; i++) {
    if (!fwAlive[i]) continue;
    // Gravity (reduced to let turbulence dominate)
    fwVy[i] += FW_GRAVITY * 0.5 * dt * speedScale;
    // Curl-like turbulence: position-dependent swirling forces
    const nx = fwNoise(fwX[i] * 0.02, fwY[i] * 0.02 + fwAge[i] * 2);
    const ny = fwNoise(fwX[i] * 0.02 + 100, fwY[i] * 0.02 + fwAge[i] * 2);
    const turb = 120 * speedScale;
    fwVx[i] += (nx - 0.5) * turb * dt;
    fwVy[i] += (ny - 0.5) * turb * dt;
    // Damping to prevent runaway velocities
    fwVx[i] *= (1 - 0.3 * dt);
    fwVy[i] *= (1 - 0.3 * dt);
    fwX[i] += fwVx[i] * dt * speedScale;
    fwY[i] += fwVy[i] * dt * speedScale;
    fwAge[i] += dt;
    if (fwAge[i] >= FW_LIFETIME) {
      fwAlive[i] = 0;
      fwCount--;
      continue;
    }
    // Branching: split at age thresholds that vary by generation
    const splitAge = FW_SPLIT_AGE * (1 + fwGen[i] * 0.3) + fwNoise(i * 0.1, 0) * 0.2;
    if (!fwSplit[i] && fwGen[i] < FW_MAX_GEN && fwAge[i] >= splitAge) {
      fwSplit[i] = 1;
      toSplit.push(i);
    }
  }
  // Spawn children — asymmetric branching (1-3 children, varied angles)
  for (let k = 0; k < toSplit.length && fwCount < FW_MAX - 6; k++) {
    const i = toSplit[k];
    const vx = fwVx[i], vy = fwVy[i];
    const speed = Math.sqrt(vx * vx + vy * vy);
    const baseAngle = Math.atan2(vy, vx);
    const gen = fwGen[i] + 1;
    // 1-3 children with asymmetric angles and speeds
    const nChildren = 1 + ((Math.random() * 3) | 0);
    for (let c = 0; c < nChildren; c++) {
      const spread = (0.2 + Math.random() * 1.0) * (Math.random() < 0.5 ? -1 : 1);
      const childSpeed = speed * (0.4 + Math.random() * 0.8);
      const a = baseAngle + spread;
      const slot = fwNextSlot;
      if (fwAlive[slot]) fwCount--;
      fwX[slot] = fwX[i] + (Math.random() - 0.5) * 3;
      fwY[slot] = fwY[i] + (Math.random() - 0.5) * 3;
      fwVx[slot] = Math.cos(a) * childSpeed;
      fwVy[slot] = Math.sin(a) * childSpeed;
      fwHue[slot] = fwHue[i] + (Math.random() - 0.5) * 0.06;
      fwAge[slot] = 0;
      fwAlive[slot] = 1;
      fwGen[slot] = gen;
      fwSplit[slot] = 0;
      fwCount++;
      fwNextSlot = (fwNextSlot + 1) % FW_MAX;
    }
  }
}

function fwRender(w, h) {
  if (fwCount <= 0) return;
  const imgData = ctx.getImageData(0, 0, w, h);
  const data = imgData.data;
  for (let i = 0; i < FW_MAX; i++) {
    if (!fwAlive[i]) continue;
    const alpha = 1 - (fwAge[i] / FW_LIFETIME);
    const cx = Math.round(fwX[i]);
    const cy = Math.round(fwY[i]);
    const rgb = hsvToRgb(fwHue[i], 0.9, 1.0);
    for (let dy = -1; dy <= 1; dy++) {
      const py = cy + dy;
      if (py < 0 || py >= h) continue;
      for (let dx = -1; dx <= 1; dx++) {
        const px = cx + dx;
        if (px < 0 || px >= w) continue;
        const a = (dx === 0 && dy === 0) ? alpha : alpha * 0.5;
        const pi = (py * w + px) * 4;
        data[pi] = data[pi] + (rgb[0] - data[pi]) * a;
        data[pi + 1] = data[pi + 1] + (rgb[1] - data[pi + 1]) * a;
        data[pi + 2] = data[pi + 2] + (rgb[2] - data[pi + 2]) * a;
      }
    }
  }
  ctx.putImageData(imgData, 0, 0);
}

function fwSpawnFromChangedBlocks(w, h, sw, sh) {
  if (!deltaChangeAge) return;
  const bs = Math.max(blockSize, 1);
  // Collect edge blocks: changed blocks adjacent to unchanged blocks
  const edges = [];
  const totalDuration = deltaSweepDuration + deltaFadeDuration;
  for (let by = 0; by < sh; by++) {
    for (let bx = 0; bx < sw; bx++) {
      const bi = by * sw + bx;
      if (deltaChangeAge[bi] !== 0) continue;
      if (dustChangeRate && dustChangeRate[bi] < dustThreshold) continue;
      // Check if any neighbor is unchanged
      let isEdge = false;
      if (bx === 0 || bx === sw - 1 || by === 0 || by === sh - 1) {
        isEdge = true;
      } else {
        if (deltaChangeAge[bi - 1] >= totalDuration) isEdge = true;
        else if (deltaChangeAge[bi + 1] >= totalDuration) isEdge = true;
        else if (deltaChangeAge[bi - sw] >= totalDuration) isEdge = true;
        else if (deltaChangeAge[bi + sw] >= totalDuration) isEdge = true;
      }
      if (isEdge) edges.push(bi);
    }
  }
  if (edges.length === 0) return;
  // Sample edges based on density (dustDensity% of available edges, capped by pool)
  const maxPoints = Math.min(edges.length, Math.ceil(edges.length * dustDensity / 100), FW_MAX);
  const step = edges.length <= maxPoints ? 1 : edges.length / maxPoints;
  let spawned = 0;
  for (let ei = 0; ei < edges.length && spawned < FW_MAX; ei += step) {
    const bi = edges[ei | 0];
    const bx = bi % sw;
    const by = (bi / sw) | 0;
    const cx = Math.min((bx * bs + bs / 2) | 0, w - 1);
    const cy = Math.min((by * bs + bs / 2) | 0, h - 1);
    const hue = dustHueStart + Math.random() * (dustHueEnd - dustHueStart);
    fwSpawn(cx, cy, hue, 1, dustSpread);
    spawned++;
  }
}

function resetFireworks() {
  fwAlive.fill(0);
  fwGen.fill(0);
  fwSplit.fill(0);
  fwCount = 0;
  fwNextSlot = 0;
}

// ── Trails mode: spawn particles aligned to motion direction ──
function trailsSpawnFromChangedBlocks(w, h, sw, sh) {
  if (!deltaChangeAge) return;
  const bs = Math.max(blockSize, 1);
  const totalDuration = deltaSweepDuration + deltaFadeDuration;
  const maxSpawn = Math.ceil(trailDensity * 1.5);
  let spawned = 0;

  for (let by = 1; by < sh - 1 && spawned < maxSpawn; by++) {
    for (let bx = 1; bx < sw - 1 && spawned < maxSpawn; bx++) {
      const bi = by * sw + bx;
      if (deltaChangeAge[bi] !== 0) continue;
      if (dustChangeRate && dustChangeRate[bi] < 3) continue;

      // Compute motion direction from neighbor change pattern
      let dx = 0, dy = 0;
      if (deltaChangeAge[bi - 1] >= totalDuration) dx -= 1;
      if (deltaChangeAge[bi + 1] >= totalDuration) dx += 1;
      if (deltaChangeAge[bi - sw] >= totalDuration) dy -= 1;
      if (deltaChangeAge[bi + sw] >= totalDuration) dy += 1;
      if (dx === 0 && dy === 0) continue; // not an edge

      const mag = Math.sqrt(dx * dx + dy * dy);
      dx /= mag; dy /= mag;

      const cx = Math.min((bx * bs + bs / 2) | 0, w - 1);
      const cy = Math.min((by * bs + bs / 2) | 0, h - 1);
      const hue = trailHueStart + Math.random() * (trailHueEnd - trailHueStart);
      const speed = trailSpeed * (0.5 + Math.random() * 0.8);

      const slot = fwNextSlot;
      if (fwAlive[slot]) fwCount--;
      fwX[slot] = cx + (Math.random() - 0.5) * bs;
      fwY[slot] = cy + (Math.random() - 0.5) * bs;
      // Velocity aligned to motion direction with some jitter
      const jitter = (Math.random() - 0.5) * 0.6;
      fwVx[slot] = (dx + jitter) * speed;
      fwVy[slot] = (dy + jitter) * speed;
      fwHue[slot] = hue;
      fwAge[slot] = 0;
      fwAlive[slot] = 1;
      fwGen[slot] = 0;
      fwSplit[slot] = 0;
      fwCount++;
      fwNextSlot = (fwNextSlot + 1) % FW_MAX;
      spawned++;
    }
  }
}

function trailsUpdate(dt) {
  for (let i = 0; i < FW_MAX; i++) {
    if (!fwAlive[i]) continue;
    // Gentle drag, no gravity, no branching
    fwVx[i] *= (1 - 0.8 * dt);
    fwVy[i] *= (1 - 0.8 * dt);
    fwX[i] += fwVx[i] * dt;
    fwY[i] += fwVy[i] * dt;
    fwAge[i] += dt;
    if (fwAge[i] >= trailLength) {
      fwAlive[i] = 0;
      fwCount--;
    }
  }
}

function trailsRender(w, h) {
  if (fwCount <= 0) return;
  const imgData = ctx.getImageData(0, 0, w, h);
  const data = imgData.data;
  for (let i = 0; i < FW_MAX; i++) {
    if (!fwAlive[i]) continue;
    const alpha = Math.pow(1 - (fwAge[i] / trailLength), 0.5);
    const cx = Math.round(fwX[i]);
    const cy = Math.round(fwY[i]);
    if (cx < 0 || cx >= w || cy < 0 || cy >= h) continue;
    const rgb = hsvToRgb(fwHue[i], 0.85, 1.0);
    // Render as a 1px dot with soft glow
    for (let dy = -1; dy <= 1; dy++) {
      const py = cy + dy;
      if (py < 0 || py >= h) continue;
      for (let dx = -1; dx <= 1; dx++) {
        const px = cx + dx;
        if (px < 0 || px >= w) continue;
        const a = (dx === 0 && dy === 0) ? alpha : alpha * 0.3;
        const pi = (py * w + px) * 4;
        data[pi] = data[pi] + (rgb[0] - data[pi]) * a;
        data[pi + 1] = data[pi + 1] + (rgb[1] - data[pi + 1]) * a;
        data[pi + 2] = data[pi + 2] + (rgb[2] - data[pi + 2]) * a;
      }
    }
  }
  ctx.putImageData(imgData, 0, 0);
}

// ── Glow mode: heat buffer overlay ──
function glowResetBuffer(sw, sh) {
  glowBuffer = new Float32Array(sw * sh);
  glowPrevSw = sw;
  glowPrevSh = sh;
}

function glowUpdate(sw, sh, dt) {
  if (!glowBuffer || glowPrevSw !== sw || glowPrevSh !== sh) {
    glowResetBuffer(sw, sh);
  }
  if (!deltaChangeAge) return;
  const addRate = glowIntensity / 50;        // 0..2
  const decayRate = 1 - (glowDecay / 100) * dt * 5;  // per frame decay

  for (let i = 0; i < sw * sh; i++) {
    // Add heat where motion detected
    if (deltaChangeAge[i] < 0.05) {
      glowBuffer[i] = Math.min(glowBuffer[i] + addRate * dt * 10, 1.0);
    }
    // Decay
    glowBuffer[i] *= decayRate;
    if (glowBuffer[i] < 0.005) glowBuffer[i] = 0;
  }

  // Spatial blur: average with neighbors for soft glow
  const tmp = new Float32Array(sw * sh);
  for (let y = 0; y < sh; y++) {
    for (let x = 0; x < sw; x++) {
      const i = y * sw + x;
      let sum = glowBuffer[i] * 4;
      let count = 4;
      if (x > 0) { sum += glowBuffer[i - 1]; count++; }
      if (x < sw - 1) { sum += glowBuffer[i + 1]; count++; }
      if (y > 0) { sum += glowBuffer[i - sw]; count++; }
      if (y < sh - 1) { sum += glowBuffer[i + sw]; count++; }
      tmp[i] = sum / count;
    }
  }
  glowBuffer.set(tmp);
}

function glowRender(w, h) {
  if (!glowBuffer) return;
  const sw = glowPrevSw, sh = glowPrevSh;
  if (!sw || !sh) return;

  let anyActive = false;
  for (let i = 0; i < sw * sh; i++) {
    if (glowBuffer[i] > 0.01) { anyActive = true; break; }
  }
  if (!anyActive) return;

  const bs = Math.max(blockSize, 1);
  const imgData = ctx.getImageData(0, 0, w, h);
  const data = imgData.data;

  for (let py = 0; py < h; py++) {
    const by = Math.min((py / bs) | 0, sh - 1);
    for (let px = 0; px < w; px++) {
      const bx = Math.min((px / bs) | 0, sw - 1);
      const heat = glowBuffer[by * sw + bx];
      if (heat < 0.01) continue;

      const t = heat;
      const hue = glowHueStart + t * (glowHueEnd - glowHueStart);
      const rgb = hsvToRgb(hue, 0.9, 1.0);
      const alpha = Math.min(heat * 0.8, 0.85);
      const pi = (py * w + px) * 4;
      data[pi] = data[pi] + (rgb[0] - data[pi]) * alpha;
      data[pi + 1] = data[pi + 1] + (rgb[1] - data[pi + 1]) * alpha;
      data[pi + 2] = data[pi + 2] + (rgb[2] - data[pi + 2]) * alpha;
    }
  }
  ctx.putImageData(imgData, 0, 0);
}

// ── Outline mode: particles that trace edges ──
function outlineSpawnFromEdges(w, h, sw, sh) {
  if (!deltaChangeAge) return;
  const bs = Math.max(blockSize, 1);
  const totalDuration = deltaSweepDuration + deltaFadeDuration;
  const maxSpawn = Math.ceil(outlineDensity * 1.2);
  let spawned = 0;

  for (let by = 1; by < sh - 1 && spawned < maxSpawn; by++) {
    for (let bx = 1; bx < sw - 1 && spawned < maxSpawn; bx++) {
      const bi = by * sw + bx;
      if (deltaChangeAge[bi] !== 0) continue;

      // Find edge normal (direction from changed toward unchanged)
      let nx = 0, ny = 0;
      if (deltaChangeAge[bi - 1] >= totalDuration) nx -= 1;
      if (deltaChangeAge[bi + 1] >= totalDuration) nx += 1;
      if (deltaChangeAge[bi - sw] >= totalDuration) ny -= 1;
      if (deltaChangeAge[bi + sw] >= totalDuration) ny += 1;
      if (nx === 0 && ny === 0) continue; // not an edge

      // Tangent is perpendicular to normal (rotate 90 degrees)
      const tx = -ny, ty = nx;
      const mag = Math.sqrt(tx * tx + ty * ty);

      const cx = Math.min((bx * bs + bs / 2) | 0, w - 1);
      const cy = Math.min((by * bs + bs / 2) | 0, h - 1);
      const hue = outlineHueStart + Math.random() * (outlineHueEnd - outlineHueStart);
      const speed = outlineSpeed * (0.6 + Math.random() * 0.8);
      // Random direction along tangent
      const dir = Math.random() < 0.5 ? 1 : -1;

      const slot = fwNextSlot;
      if (fwAlive[slot]) fwCount--;
      fwX[slot] = cx;
      fwY[slot] = cy;
      fwVx[slot] = (tx / mag) * speed * dir + (Math.random() - 0.5) * 10;
      fwVy[slot] = (ty / mag) * speed * dir + (Math.random() - 0.5) * 10;
      fwHue[slot] = hue;
      fwAge[slot] = 0;
      fwAlive[slot] = 1;
      fwGen[slot] = 0;
      fwSplit[slot] = 0;
      fwCount++;
      fwNextSlot = (fwNextSlot + 1) % FW_MAX;
      spawned++;
    }
  }
}

function outlineUpdate(dt) {
  for (let i = 0; i < FW_MAX; i++) {
    if (!fwAlive[i]) continue;
    // Strong drag to keep particles near edges
    fwVx[i] *= (1 - 2.5 * dt);
    fwVy[i] *= (1 - 2.5 * dt);
    fwX[i] += fwVx[i] * dt;
    fwY[i] += fwVy[i] * dt;
    fwAge[i] += dt;
    if (fwAge[i] >= 0.8) {
      fwAlive[i] = 0;
      fwCount--;
    }
  }
}

// ── Eruptions mode: burst on motion spikes ──
function eruptionsCheck(w, h, sw, sh) {
  if (!deltaChangeAge) return;
  // Count currently changed blocks
  let changeCount = 0;
  for (let i = 0; i < sw * sh; i++) {
    if (deltaChangeAge[i] < 0.05) changeCount++;
  }

  const spike = changeCount - prevChangeCount;
  const threshold = eruptThreshold * sw * sh / 5000; // scale with resolution
  prevChangeCount = changeCount;

  if (spike > threshold && changeCount > 10) {
    // Find center of changed area
    let sumX = 0, sumY = 0, count = 0;
    const bs = Math.max(blockSize, 1);
    for (let by = 0; by < sh; by++) {
      for (let bx = 0; bx < sw; bx++) {
        if (deltaChangeAge[by * sw + bx] < 0.05) {
          sumX += bx * bs + bs / 2;
          sumY += by * bs + bs / 2;
          count++;
        }
      }
    }
    if (count > 0) {
      const cx = Math.min((sumX / count) | 0, w - 1);
      const cy = Math.min((sumY / count) | 0, h - 1);
      const hue = eruptHueStart + Math.random() * (eruptHueEnd - eruptHueStart);
      // Scale burst size by spike magnitude
      const burstCount = Math.min(eruptSize, Math.ceil(eruptSize * spike / (threshold * 3)));
      fwSpawn(cx, cy, hue, burstCount, 200 + spike * 0.5, 0);
    }
  }
}

function drawCurrentFrame(now) {
  const w = video.videoWidth;
  const h = video.videoHeight;
  if (!w || !h) return;
  const bs = blockSize;
  const needDetection = deltaEnabled || dustEnabled;
  const bsMax = Math.max(bs, 1);
  const sw = Math.ceil(w / bsMax);
  const sh = Math.ceil(h / bsMax);

  // 1. Draw base frame; also prepare small canvas for change detection
  let smallReady = false;
  if (bs > 1) {
    small.width = sw;
    small.height = sh;
    sctx.drawImage(video, 0, 0, sw, sh);
    smallReady = true;
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(small, 0, 0, w, h);
  } else {
    ctx.drawImage(video, 0, 0, w, h);
  }

  // 2. Draw video to small canvas for change detection (skip if already done above)
  if (needDetection && !smallReady) {
    small.width = sw;
    small.height = sh;
    sctx.drawImage(video, 0, 0, sw, sh);
  }

  // 3. Change detection (shared by linger and fireworks)
  if (needDetection) {
    detectChangedBlocks(now || performance.now(), sw, sh);
  }

  // 5. Linger overlay
  if (deltaEnabled) {
    applyLingerOverlay(w, h);
  }

  // 6. Dust effects (mode-dependent)
  if (dustEnabled) {
    let fwDt = 0;
    if (now && fwLastTimestamp > 0) {
      fwDt = Math.min((now - fwLastTimestamp) / 1000, 0.1);
    }
    if (now) fwLastTimestamp = now;

    if (dustMode === 'classic') {
      fwSpawnFromChangedBlocks(w, h, sw, sh);
      fwUpdate(fwDt);
      fwRender(w, h);
    } else if (dustMode === 'trails') {
      trailsSpawnFromChangedBlocks(w, h, sw, sh);
      trailsUpdate(fwDt);
      trailsRender(w, h);
    } else if (dustMode === 'glow') {
      glowUpdate(sw, sh, fwDt);
      glowRender(w, h);
    } else if (dustMode === 'outline') {
      outlineSpawnFromEdges(w, h, sw, sh);
      outlineUpdate(fwDt);
      fwRender(w, h); // reuse particle renderer
    } else if (dustMode === 'eruptions') {
      eruptionsCheck(w, h, sw, sh);
      fwUpdate(fwDt);
      fwRender(w, h);
    }
  }

  // Final: apply blur to entire composited frame
  if (blurRadius > 0) {
    ctx.filter = `blur(${blurRadius}px)`;
    ctx.drawImage(canvas, 0, 0);
    ctx.filter = 'none';
  }
}

video.addEventListener('loadedmetadata', () => {
  document.getElementById('spinner').remove();
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  const maxW = window.innerWidth * 0.9;
  const displayW = Math.min(video.videoWidth, maxW);
  const displayH = displayW * video.videoHeight / video.videoWidth;
  canvas.style.width = displayW + 'px';
  canvas.style.height = displayH + 'px';
  ctx.imageSmoothingEnabled = false;
  updateTime();
  drawCurrentFrame();
  document.getElementById('playOverlay').style.display = '';
});

video.addEventListener('play', () => {
  if (animId) cancelAnimationFrame(animId);
  renderLoop();
});

video.addEventListener('ended', () => {
  if (animId) cancelAnimationFrame(animId);
  updateTime();
});

video.addEventListener('timeupdate', updateTime);

// Play overlay
document.getElementById('playOverlay').addEventListener('click', () => {
  document.getElementById('playOverlay').style.display = 'none';
  video.muted = false;
  video.play();
});

// Transport controls
playBtn.addEventListener('click', () => {
  document.getElementById('playOverlay').style.display = 'none';
  video.muted = false;
  video.play();
});
pauseBtn.addEventListener('click', () => video.pause());
stopBtn.addEventListener('click', () => {
  video.pause();
  video.currentTime = 0;
  if (deltaEnabled || dustEnabled) {
    const bs = Math.max(blockSize, 1);
    const sw = Math.ceil(video.videoWidth / bs);
    const sh = Math.ceil(video.videoHeight / bs);
    if (sw > 0 && sh > 0) resetDeltaBuffers(sw, sh);
  }
  resetFireworks();
  if (glowBuffer) glowBuffer.fill(0);
  prevChangeCount = 0;
  updateTime();
  drawCurrentFrame();
});

// Scrub bar
scrub.addEventListener('input', () => {
  isScrubbing = true;
  if (video.duration) {
    video.currentTime = (scrub.value / 1000) * video.duration;
    if (deltaEnabled || dustEnabled) {
      const bs = Math.max(blockSize, 1);
      const sw = Math.ceil(video.videoWidth / bs);
      const sh = Math.ceil(video.videoHeight / bs);
      if (sw > 0 && sh > 0) resetDeltaBuffers(sw, sh);
    }
    resetFireworks();
    if (glowBuffer) glowBuffer.fill(0);
    prevChangeCount = 0;
    drawCurrentFrame();
    updateTime();
  }
});
scrub.addEventListener('change', () => {
  isScrubbing = false;
});

blockSlider.addEventListener('input', () => {
  blockSize = parseInt(blockSlider.value);
  blockValue.textContent = blockSize;
  if (deltaEnabled || dustEnabled) {
    const bs = Math.max(blockSize, 1);
    const sw = Math.ceil(video.videoWidth / bs);
    const sh = Math.ceil(video.videoHeight / bs);
    if (sw > 0 && sh > 0) resetDeltaBuffers(sw, sh);
  }
  resetFireworks();
});

blurSlider.addEventListener('input', () => {
  blurRadius = parseInt(blurSlider.value);
  blurValueEl.textContent = blurRadius;
});

// Linger controls

  deltaEnabled = deltaToggle.checked;
  if (deltaEnabled) {
    lingerBody.classList.remove('disabled');
    const bs = Math.max(blockSize, 1);
    const sw = Math.ceil(video.videoWidth / bs);
    const sh = Math.ceil(video.videoHeight / bs);
    if (sw > 0 && sh > 0) resetDeltaBuffers(sw, sh);
  } else {
    lingerBody.classList.add('disabled');
  }

deltaSpeedSlider.addEventListener('input', () => {

deltaColorEndEl.addEventListener('input', () => {

dustDensitySlider.addEventListener('input', () => {

});

dustSpreadSlider.addEventListener('input', () => {
  dustSpeed = parseInt(dustSpreadSlider.value);
});

dustSensitivitySlider.addEventListener('input', () => {
  dustThreshold = 20 - parseInt(dustSensitivitySlider.value);
});

dustColorStartEl.addEventListener('input', () => {
  dustHueStart = hexToHue(dustColorStartEl.value);
});
dustColorEndEl.addEventListener('input', () => {
  dustHueEnd = hexToHue(dustColorEndEl.value);
});

// Dust mode tab switching
const dustModeRadios = document.querySelectorAll('input[name="dustMode"]');
const dustControlPanels = {
  classic: document.getElementById('dustClassicControls'),
  trails: document.getElementById('dustTrailsControls'),
  glow: document.getElementById('dustGlowControls'),
  outline: document.getElementById('dustOutlineControls'),
  eruptions: document.getElementById('dustEruptionsControls'),
};

function switchDustMode(mode) {
  dustMode = mode;
  for (const [k, panel] of Object.entries(dustControlPanels)) {
    panel.style.display = k === mode ? '' : 'none';
  }
  document.querySelectorAll('.dust-tab').forEach(tab => {
    tab.classList.toggle('active', tab.querySelector('input').value === mode);
  });
  resetFireworks();
}

dustModeRadios.forEach(radio => {
  radio.addEventListener('change', () => switchDustMode(radio.value));
});

// Trails controls
document.getElementById('trailLength').addEventListener('input', function() { trailLength = this.value / 100; });
document.getElementById('trailSpeed').addEventListener('input', function() { trailSpeed = parseInt(this.value); });
document.getElementById('trailDensity').addEventListener('input', function() { trailDensity = parseInt(this.value); });
document.getElementById('trailColorStart').addEventListener('input', function() { trailHueStart = hexToHue(this.value); });
document.getElementById('trailColorEnd').addEventListener('input', function() { trailHueEnd = hexToHue(this.value); });

// Glow controls
document.getElementById('glowIntensity').addEventListener('input', function() { glowIntensity = parseInt(this.value); });
document.getElementById('glowDecay').addEventListener('input', function() { glowDecay = parseInt(this.value); });
document.getElementById('glowColorStart').addEventListener('input', function() { glowHueStart = hexToHue(this.value); });
document.getElementById('glowColorEnd').addEventListener('input', function() { glowHueEnd = hexToHue(this.value); });

// Outline controls
document.getElementById('outlineSpeed').addEventListener('input', function() { outlineSpeed = parseInt(this.value); });
document.getElementById('outlineDensity').addEventListener('input', function() { outlineDensity = parseInt(this.value); });
document.getElementById('outlineColorStart').addEventListener('input', function() { outlineHueStart = hexToHue(this.value); });
document.getElementById('outlineColorEnd').addEventListener('input', function() { outlineHueEnd = hexToHue(this.value); });

// Eruption controls
document.getElementById('eruptThreshold').addEventListener('input', function() { eruptThreshold = parseInt(this.value); });
document.getElementById('eruptSize').addEventListener('input', function() { eruptSize = parseInt(this.value); });
document.getElementById('eruptColorStart').addEventListener('input', function() { eruptHueStart = hexToHue(this.value); });
document.getElementById('eruptColorEnd').addEventListener('input', function() { eruptHueEnd = hexToHue(this.value); });

function renderLoop(timestamp) {
  if (video.paused || video.ended) return;
  drawCurrentFrame(timestamp);
  animId = requestAnimationFrame(renderLoop);
}

// Config save/share via URL
function getConfig() {
  const cfg = {
    bs: parseInt(document.getElementById('blockSize').value),
    bl: parseInt(document.getElementById('blurSize').value),
    le: document.getElementById('deltaToggle').checked,
    ld: parseInt(document.getElementById('deltaSpeed').value),
    lc1: document.getElementById('deltaColorStart').value,
    lc2: document.getElementById('deltaColorEnd').value,
    de: document.getElementById('dustToggle').checked,
    dm: dustMode,
    ds: parseInt(document.getElementById('dustSpeed').value),
    dd: parseInt(document.getElementById('dustDensity').value),
    dp: parseInt(document.getElementById('dustSpread').value),
    dx: parseInt(document.getElementById('dustSensitivity').value),
    dc1: document.getElementById('dustColorStart').value,
    dc2: document.getElementById('dustColorEnd').value,
    tl: parseInt(document.getElementById('trailLength').value),
    ts: parseInt(document.getElementById('trailSpeed').value),
    td: parseInt(document.getElementById('trailDensity').value),
    tc1: document.getElementById('trailColorStart').value,
    tc2: document.getElementById('trailColorEnd').value,
    gi: parseInt(document.getElementById('glowIntensity').value),
    gd: parseInt(document.getElementById('glowDecay').value),
    gc1: document.getElementById('glowColorStart').value,
    gc2: document.getElementById('glowColorEnd').value,
    os: parseInt(document.getElementById('outlineSpeed').value),
    od: parseInt(document.getElementById('outlineDensity').value),
    oc1: document.getElementById('outlineColorStart').value,
    oc2: document.getElementById('outlineColorEnd').value,
    et: parseInt(document.getElementById('eruptThreshold').value),
    eb: parseInt(document.getElementById('eruptSize').value),
    ec1: document.getElementById('eruptColorStart').value,
    ec2: document.getElementById('eruptColorEnd').value,
  };
  return cfg;
}

function applyConfig(cfg) {
  if (cfg.bs != null) { blockSlider.value = cfg.bs; blockSize = cfg.bs; blockValue.textContent = cfg.bs; }
  if (cfg.bl != null) { blurSlider.value = cfg.bl; blurRadius = cfg.bl; blurValueEl.textContent = cfg.bl; }
  if (cfg.le != null) {
    deltaToggle.checked = cfg.le;
    deltaEnabled = cfg.le;
    lingerBody.classList.toggle('disabled', !cfg.le);
  }
  if (cfg.ld != null) {
    deltaSpeedSlider.value = cfg.ld;
    deltaSweepDuration = cfg.ld / 100;
    deltaFadeDuration = deltaSweepDuration * 0.5;
  }
  if (cfg.lc1 != null) { deltaColorStartEl.value = cfg.lc1; deltaHueStart = hexToHue(cfg.lc1); }
  if (cfg.lc2 != null) { deltaColorEndEl.value = cfg.lc2; deltaHueEnd = hexToHue(cfg.lc2); }
  if (cfg.de != null) {
    dustToggle.checked = cfg.de;
    dustEnabled = cfg.de;
    dustBody.classList.toggle('disabled', !cfg.de);
  }
  if (cfg.dm != null) { switchDustMode(cfg.dm); }
  if (cfg.ds != null) { dustSpeedSlider.value = cfg.ds; dustSpread = cfg.ds; }
  if (cfg.dd != null) { dustDensitySlider.value = cfg.dd; dustDensity = cfg.dd; }
  if (cfg.dp != null) { dustSpreadSlider.value = cfg.dp; dustSpeed = cfg.dp; }
  if (cfg.dx != null) { dustSensitivitySlider.value = cfg.dx; dustThreshold = 20 - cfg.dx; }
  if (cfg.dc1 != null) { dustColorStartEl.value = cfg.dc1; dustHueStart = hexToHue(cfg.dc1); }
  if (cfg.dc2 != null) { dustColorEndEl.value = cfg.dc2; dustHueEnd = hexToHue(cfg.dc2); }
  // Trails
  if (cfg.tl != null) { document.getElementById('trailLength').value = cfg.tl; trailLength = cfg.tl / 100; }
  if (cfg.ts != null) { document.getElementById('trailSpeed').value = cfg.ts; trailSpeed = cfg.ts; }
  if (cfg.td != null) { document.getElementById('trailDensity').value = cfg.td; trailDensity = cfg.td; }
  if (cfg.tc1 != null) { document.getElementById('trailColorStart').value = cfg.tc1; trailHueStart = hexToHue(cfg.tc1); }
  if (cfg.tc2 != null) { document.getElementById('trailColorEnd').value = cfg.tc2; trailHueEnd = hexToHue(cfg.tc2); }
  // Glow
  if (cfg.gi != null) { document.getElementById('glowIntensity').value = cfg.gi; glowIntensity = cfg.gi; }
  if (cfg.gd != null) { document.getElementById('glowDecay').value = cfg.gd; glowDecay = cfg.gd; }
  if (cfg.gc1 != null) { document.getElementById('glowColorStart').value = cfg.gc1; glowHueStart = hexToHue(cfg.gc1); }
  if (cfg.gc2 != null) { document.getElementById('glowColorEnd').value = cfg.gc2; glowHueEnd = hexToHue(cfg.gc2); }
  // Outline
  if (cfg.os != null) { document.getElementById('outlineSpeed').value = cfg.os; outlineSpeed = cfg.os; }
  if (cfg.od != null) { document.getElementById('outlineDensity').value = cfg.od; outlineDensity = cfg.od; }
  if (cfg.oc1 != null) { document.getElementById('outlineColorStart').value = cfg.oc1; outlineHueStart = hexToHue(cfg.oc1); }
  if (cfg.oc2 != null) { document.getElementById('outlineColorEnd').value = cfg.oc2; outlineHueEnd = hexToHue(cfg.oc2); }
  // Eruptions
  if (cfg.et != null) { document.getElementById('eruptThreshold').value = cfg.et; eruptThreshold = cfg.et; }
  if (cfg.eb != null) { document.getElementById('eruptSize').value = cfg.eb; eruptSize = cfg.eb; }
  if (cfg.ec1 != null) { document.getElementById('eruptColorStart').value = cfg.ec1; eruptHueStart = hexToHue(cfg.ec1); }
  if (cfg.ec2 != null) { document.getElementById('eruptColorEnd').value = cfg.ec2; eruptHueEnd = hexToHue(cfg.ec2); }
}

function loadConfigFromURL() {
  const hash = location.hash.slice(1);
  if (!hash.startsWith('cfg=')) return;
  try {
    const cfg = JSON.parse(atob(hash.slice(4)));
    applyConfig(cfg);
  } catch (e) { /* ignore malformed */ }
}

document.getElementById('shareBtn').addEventListener('click', () => {
  const cfg = getConfig();
  const encoded = btoa(JSON.stringify(cfg));
  location.hash = 'cfg=' + encoded;
  const url = location.href;
  navigator.clipboard.writeText(url).then(() => {
    const btn = document.getElementById('shareBtn');
    btn.textContent = 'Copied!';
    setTimeout(() => { btn.textContent = 'Share'; }, 1500);
  });
});

loadConfigFromURL();

// Auto-load on page open
loadVideo();
</script>
