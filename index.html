<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bad Apple Pixelator</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #111;
    color: #eee;
    font-family: system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 1.5rem;
  }
  h1 {
    font-size: 1.4rem;
    font-weight: 600;
    margin-bottom: 1rem;
    letter-spacing: 0.02em;
  }
  .controls {
    display: flex;
    gap: 1.5rem;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 1rem;
    padding: 0.75rem 1.25rem;
    background: #1a1a1a;
    border-radius: 8px;
    border: 1px solid #333;
  }
  .control-group {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  label {
    font-size: 0.85rem;
    color: #aaa;
    white-space: nowrap;
  }
  input[type="range"] {
    width: 10rem;
    accent-color: #888;
  }
  .block-value {
    font-variant-numeric: tabular-nums;
    min-width: 2.5rem;
    text-align: right;
    font-size: 0.85rem;
  }
  button {
    background: #333;
    color: #eee;
    border: 1px solid #555;
    padding: 0.35rem 1rem;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.85rem;
  }
  button:hover { background: #444; }
  .transport {
    display: flex;
    gap: 0.75rem;
    align-items: center;
    margin-bottom: 1rem;
    padding: 0.5rem 1.25rem;
    background: #1a1a1a;
    border-radius: 8px;
    border: 1px solid #333;
    width: fit-content;
  }
  .transport button { min-width: 3rem; }
  #scrub {
    width: 20rem;
    accent-color: #888;
  }
  #timeDisplay {
    font-size: 0.8rem;
    font-variant-numeric: tabular-nums;
    color: #aaa;
    min-width: 7rem;
    text-align: center;
  }
  .canvas-wrap {
    position: relative;
    background: #000;
    border-radius: 4px;
    overflow: hidden;
    line-height: 0;
  }
  .color-controls {
    display: flex;
    gap: 1rem;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 1rem;
    padding: 0.75rem 1.25rem;
    background: #1a1a1a;
    border-radius: 8px;
    border: 1px solid #333;
  }
  .color-controls input[type="range"] {
    width: 7rem;
  }
  .color-controls input[type="range"]:disabled {
    opacity: 0.3;
  }
  .color-controls input[type="checkbox"] {
    accent-color: #e66;
  }
  .color-value {
    font-variant-numeric: tabular-nums;
    min-width: 2rem;
    text-align: right;
    font-size: 0.85rem;
  }
  .canvas-wrap { width: 480px; aspect-ratio: 4/3; }
  .spinner {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    z-index: 1;
  }
  .spinner::after {
    content: '';
    width: 2rem;
    height: 2rem;
    border: 3px solid #333;
    border-top-color: #888;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  canvas { display: block; max-width: 90vw; }
  video { display: none; }
</style>
</head>
<body>

<h1>Bad Apple Pixelator</h1>

<div class="controls">
  <div class="control-group">
    <label for="blockSize">Block size:</label>
    <input type="range" id="blockSize" min="1" max="64" value="32">
    <span class="block-value" id="blockValue">32</span>
  </div>
</div>

<div class="color-controls">
  <div class="control-group">
    <label><input type="checkbox" id="colorToggle"> Color</label>
  </div>
  <div class="control-group">
    <label for="audioSlider">Audio</label>
    <input type="range" id="audioSlider" min="0" max="100" value="0" disabled>
    <span class="color-value" id="audioValue">0%</span>
  </div>
  <div class="control-group">
    <label for="cycleSlider">Cycle</label>
    <input type="range" id="cycleSlider" min="0" max="100" value="0" disabled>
    <span class="color-value" id="cycleValue">0%</span>
  </div>
  <div class="control-group">
    <label for="pinwheelSlider">Pinwheel</label>
    <input type="range" id="pinwheelSlider" min="0" max="100" value="0" disabled>
    <span class="color-value" id="pinwheelValue">0%</span>
  </div>
</div>

<div class="transport">
  <button id="playBtn">Play</button>
  <button id="pauseBtn">Pause</button>
  <button id="stopBtn">Stop</button>
  <input type="range" id="scrub" min="0" max="1000" value="0">
  <span id="timeDisplay">0:00 / 0:00</span>
</div>

<div class="canvas-wrap">
  <div class="spinner" id="spinner"></div>
  <canvas id="canvas"></canvas>
</div>

<video id="video" playsinline></video>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const blockSlider = document.getElementById('blockSize');
const blockValue = document.getElementById('blockValue');
const playBtn = document.getElementById('playBtn');
const pauseBtn = document.getElementById('pauseBtn');
const stopBtn = document.getElementById('stopBtn');
const scrub = document.getElementById('scrub');
const timeDisplay = document.getElementById('timeDisplay');
const colorToggle = document.getElementById('colorToggle');
const audioSlider = document.getElementById('audioSlider');
const cycleSlider = document.getElementById('cycleSlider');
const pinwheelSlider = document.getElementById('pinwheelSlider');
const audioValueEl = document.getElementById('audioValue');
const cycleValueEl = document.getElementById('cycleValue');
const pinwheelValueEl = document.getElementById('pinwheelValue');

let blockSize = 32;
let animId = null;
let isScrubbing = false;

// Color state
let colorEnabled = false;
let audioWeight = 0;
let timeWeight = 0;
let spatialWeight = 0;

// Audio state
let audioCtx = null;
let analyser = null;
let freqData = null;
let audioSourceConnected = false;

// Color constants
const SATURATION = 0.95;
const PITCH_HZ_MIN = 100;
const PITCH_HZ_MAX = 1200;
const LOG_MIN = Math.log(PITCH_HZ_MIN);
const LOG_MAX = Math.log(PITCH_HZ_MAX);

// Spatial map cache
let spatialMapCache = null;
let spatialMapW = 0;
let spatialMapH = 0;

// Offscreen canvas for downsampling
const small = document.createElement('canvas');
const sctx = small.getContext('2d');

function loadVideo() {
  video.src = 'r2/full_video.mp4';
  video.load();
}

function fmtTime(s) {
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return m + ':' + String(sec).padStart(2, '0');
}

function updateTime() {
  const cur = fmtTime(video.currentTime);
  const dur = fmtTime(video.duration || 0);
  timeDisplay.textContent = cur + ' / ' + dur;
  if (!isScrubbing && video.duration) {
    scrub.value = (video.currentTime / video.duration) * 1000;
  }
}

function hsvToRgb(h, s, v) {
  h = ((h % 1) + 1) % 1;
  const i = (h * 6) | 0;
  const f = h * 6 - i;
  const p = v * (1 - s);
  const q = v * (1 - f * s);
  const t = v * (1 - (1 - f) * s);
  let r, g, b;
  switch (i % 6) {
    case 0: r = v; g = t; b = p; break;
    case 1: r = q; g = v; b = p; break;
    case 2: r = p; g = v; b = t; break;
    case 3: r = p; g = q; b = v; break;
    case 4: r = t; g = p; b = v; break;
    case 5: r = v; g = p; b = q; break;
  }
  return [(r * 255) | 0, (g * 255) | 0, (b * 255) | 0];
}

function initAudio() {
  if (audioCtx) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return;
  }
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 2048;
  analyser.smoothingTimeConstant = 0.6;
  freqData = new Uint8Array(analyser.frequencyBinCount);
  if (!audioSourceConnected) {
    const source = audioCtx.createMediaElementSource(video);
    source.connect(analyser);
    analyser.connect(audioCtx.destination);
    audioSourceConnected = true;
  }
}

function getDominantFrequencyHue() {
  if (!analyser || !freqData) return 0.375;
  analyser.getByteFrequencyData(freqData);
  const binHz = audioCtx.sampleRate / analyser.fftSize;
  const minBin = Math.ceil(PITCH_HZ_MIN / binHz);
  const maxBin = Math.min(Math.floor(PITCH_HZ_MAX / binHz), freqData.length - 1);
  let maxVal = 0;
  let maxIdx = minBin;
  for (let i = minBin; i <= maxBin; i++) {
    if (freqData[i] > maxVal) {
      maxVal = freqData[i];
      maxIdx = i;
    }
  }
  if (maxVal < 10) return 0.375;
  const hz = maxIdx * binHz;
  const logHz = Math.log(hz);
  return ((logHz - LOG_MIN) / (LOG_MAX - LOG_MIN)) * 0.75;
}

function getTimeCycleHue() {
  if (!video.duration) return 0;
  return (video.currentTime / video.duration) % 1.0;
}

function getSpatialMap(sw, sh) {
  if (spatialMapCache && spatialMapW === sw && spatialMapH === sh) {
    return spatialMapCache;
  }
  spatialMapCache = new Float32Array(sw * sh);
  spatialMapW = sw;
  spatialMapH = sh;
  const cx = (sw - 1) / 2;
  const cy = (sh - 1) / 2;
  for (let y = 0; y < sh; y++) {
    for (let x = 0; x < sw; x++) {
      spatialMapCache[y * sw + x] = Math.atan2(y - cy, x - cx) / (2 * Math.PI) + 0.5;
    }
  }
  return spatialMapCache;
}

function applyColorEffects(sw, sh) {
  const imgData = sctx.getImageData(0, 0, sw, sh);
  const data = imgData.data;
  const aHue = audioWeight > 0 ? getDominantFrequencyHue() : 0;
  const tHue = timeWeight > 0 ? getTimeCycleHue() : 0;
  const sMap = spatialWeight > 0 ? getSpatialMap(sw, sh) : null;
  const totalWeight = audioWeight + timeWeight + spatialWeight;
  if (totalWeight === 0) return;

  for (let i = 0; i < data.length; i += 4) {
    const brightness = (data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114);
    if (brightness <= 128) continue;
    const px = (i / 4) | 0;
    let hue = 0;
    if (audioWeight > 0) hue += aHue * audioWeight;
    if (timeWeight > 0) hue += tHue * timeWeight;
    if (spatialWeight > 0) hue += sMap[px] * spatialWeight;
    hue = (hue / totalWeight) % 1.0;
    const rgb = hsvToRgb(hue, SATURATION, 1.0);
    data[i] = rgb[0];
    data[i + 1] = rgb[1];
    data[i + 2] = rgb[2];
  }
  sctx.putImageData(imgData, 0, 0);
}

function drawCurrentFrame() {
  const w = video.videoWidth;
  const h = video.videoHeight;
  if (!w || !h) return;
  const bs = blockSize;
  const needColor = colorEnabled && (audioWeight > 0 || timeWeight > 0 || spatialWeight > 0);
  if (bs <= 1 && !needColor) {
    ctx.drawImage(video, 0, 0, w, h);
  } else {
    const sw = bs <= 1 ? w : Math.ceil(w / bs);
    const sh = bs <= 1 ? h : Math.ceil(h / bs);
    small.width = sw;
    small.height = sh;
    sctx.drawImage(video, 0, 0, sw, sh);
    if (needColor) applyColorEffects(sw, sh);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(small, 0, 0, w, h);
  }
}

video.addEventListener('loadedmetadata', () => {
  document.getElementById('spinner').remove();
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  ctx.imageSmoothingEnabled = false;
  updateTime();
  drawCurrentFrame();
  video.play().catch(e => console.warn('Autoplay blocked:', e));
});

video.addEventListener('play', () => {
  if (animId) cancelAnimationFrame(animId);
  renderLoop();
});

video.addEventListener('ended', () => {
  if (animId) cancelAnimationFrame(animId);
  updateTime();
});

video.addEventListener('timeupdate', updateTime);

// Transport controls
playBtn.addEventListener('click', () => {
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  video.play();
});
pauseBtn.addEventListener('click', () => video.pause());
stopBtn.addEventListener('click', () => {
  video.pause();
  video.currentTime = 0;
  updateTime();
  drawCurrentFrame();
});

// Scrub bar
scrub.addEventListener('input', () => {
  isScrubbing = true;
  if (video.duration) {
    video.currentTime = (scrub.value / 1000) * video.duration;
    drawCurrentFrame();
    updateTime();
  }
});
scrub.addEventListener('change', () => {
  isScrubbing = false;
});

blockSlider.addEventListener('input', () => {
  blockSize = parseInt(blockSlider.value);
  blockValue.textContent = blockSize;
});

// Color controls
colorToggle.addEventListener('change', () => {
  colorEnabled = colorToggle.checked;
  audioSlider.disabled = !colorEnabled;
  cycleSlider.disabled = !colorEnabled;
  pinwheelSlider.disabled = !colorEnabled;
  if (colorEnabled) initAudio();
});

audioSlider.addEventListener('input', () => {
  audioWeight = audioSlider.value / 100;
  audioValueEl.textContent = audioSlider.value + '%';
});
cycleSlider.addEventListener('input', () => {
  timeWeight = cycleSlider.value / 100;
  cycleValueEl.textContent = cycleSlider.value + '%';
});
pinwheelSlider.addEventListener('input', () => {
  spatialWeight = pinwheelSlider.value / 100;
  pinwheelValueEl.textContent = pinwheelSlider.value + '%';
});

function renderLoop() {
  if (video.paused || video.ended) return;
  drawCurrentFrame();
  animId = requestAnimationFrame(renderLoop);
}

// Auto-load on page open
loadVideo();
</script>

</body>
</html>
