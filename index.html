<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #111;

    font-family: system-ui, -apple-system, sans-serif;

  [data-tip] {

  [data-tip]:hover::after {
    content: attr(data-tip);

<body>

<h1>Bad Apple!!: the applening</h1>

<div class="controls">

<div class="transport">
  <button id="playBtn">Play</button>

</div>

<div class="canvas-wrap">
  <div class="spinner" id="spinner"></div>
  <div class="play-overlay" id="playOverlay" style="display:none">
    <svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="30" fill="none" stroke="#eee" stroke-width="2.5"/><polygon points="26,20 26,44 46,32" fill="#eee"/></svg>
    <span>click to start</span>
  </div>
  <canvas id="canvas"></canvas>
</div>

<video id="video" playsinline></video>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const blockSlider = document.getElementById('blockSize');
const blockValue = document.getElementById('blockValue');
const blurSlider = document.getElementById('blurSize');
const blurValueEl = document.getElementById('blurValue');
const playBtn = document.getElementById('playBtn');
const pauseBtn = document.getElementById('pauseBtn');
const stopBtn = document.getElementById('stopBtn');
const scrub = document.getElementById('scrub');
const timeDisplay = document.getElementById('timeDisplay');
const deltaToggle = document.getElementById('deltaToggle');
const deltaSpeedSlider = document.getElementById('deltaSpeed');
const deltaColorStartEl = document.getElementById('deltaColorStart');
const deltaColorEndEl = document.getElementById('deltaColorEnd');
const lingerBody = document.getElementById('lingerBody');
const dustBody = document.getElementById('dustBody');
const dustToggle = document.getElementById('dustToggle');


let blockSize = 1;
let blurRadius = 0;
let animId = null;
let isScrubbing = false;


// Delta mode state
let deltaEnabled = false;
let deltaSweepDuration = 1.1;
let deltaFadeDuration = 0.55;
let deltaPrevFrame = null;
let deltaChangeAge = null;
let deltaPrevSw = 0;
let deltaPrevSh = 0;
let deltaLastTimestamp = 0;
let deltaHueStart = 0;       // red
let deltaHueEnd = 0.762;     // violet (#8800ff)

// Dust state
let dustEnabled = false;
let dustChangeRate = null;     // Float32Array, same size as deltaChangeAge
let fwLastTimestamp = 0;
const FW_MAX = 12000;
const fwX = new Float32Array(FW_MAX);
const fwY = new Float32Array(FW_MAX);
const fwVx = new Float32Array(FW_MAX);
const fwVy = new Float32Array(FW_MAX);
const fwHue = new Float32Array(FW_MAX);
const fwAge = new Float32Array(FW_MAX);
const fwAlive = new Uint8Array(FW_MAX);
const fwGen = new Uint8Array(FW_MAX);
const fwSplit = new Uint8Array(FW_MAX);
let fwCount = 0;
let fwNextSlot = 0;

// Dust sub-mode flags (composable — multiple can be active)
let trailsOn = false;
let glowOn = false;
let outlineOn = false;
let eruptionsOn = false;

// Trails mode state
let trailLength = 1.5;      // lifetime in seconds (slider / 100)
let trailSpeed = 120;
let trailDensity = 80;
let trailHueStart = hexToHue('#00ccff');
let trailHueEnd = hexToHue('#ff00cc');

// Glow mode state
let glowIntensity = 50;
let glowDecay = 30;
let glowHueStart = hexToHue('#ff4400');
let glowHueEnd = hexToHue('#ffcc00');
let glowBuffer = null;       // Float32Array, same size as change detection grid
let glowPrevSw = 0;
let glowPrevSh = 0;

// Outline mode state
let outlineSpeed = 100;
let outlineDensity = 100;
let outlineHueStart = hexToHue('#00ff88');
let outlineHueEnd = hexToHue('#00ff88');

// Eruptions mode state
let eruptThreshold = 30;
let eruptSize = 150;
let eruptHueStart = hexToHue('#ff2200');
let eruptHueEnd = hexToHue('#ffaa00');
let prevChangeCount = 0;
let eruptSmoothedRate = 0;    // smoothed change rate for spike detection
let eruptCooldown = 0;        // cooldown timer to prevent constant firing


// Offscreen canvas for downsampling
const small = document.createElement('canvas');
const sctx = small.getContext('2d');

function loadVideo() {
  video.src = '/media/source/bad_apple.mp4';
  video.load();
}

function fmtTime(s) {
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return m + ':' + String(sec).padStart(2, '0');
}

function updateTime() {
  const cur = fmtTime(video.currentTime);
  const dur = fmtTime(video.duration || 0);
  timeDisplay.textContent = cur + ' / ' + dur;
  if (!isScrubbing && !video.seeking && video.duration) {
    scrub.value = (video.currentTime / video.duration) * 1000;
  }
}

function hexToHue(hex) {
  const r = parseInt(hex.slice(1, 3), 16) / 255;
  const g = parseInt(hex.slice(3, 5), 16) / 255;
  const b = parseInt(hex.slice(5, 7), 16) / 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b);
  if (max === min) return 0;
  const d = max - min;
  let h;
  if (max === r) h = ((g - b) / d + (g < b ? 6 : 0)) / 6;
  else if (max === g) h = ((b - r) / d + 2) / 6;
  else h = ((r - g) / d + 4) / 6;
  return h;
}

function hsvToRgb(h, s, v) {
  h = ((h % 1) + 1) % 1;
  const i = (h * 6) | 0;
  const f = h * 6 - i;
  const p = v * (1 - s);
  const q = v * (1 - f * s);
  const t = v * (1 - (1 - f) * s);
  let r, g, b;
  switch (i % 6) {
    case 0: r = v; g = t; b = p; break;
    case 1: r = q; g = v; b = p; break;
    case 2: r = p; g = v; b = t; break;
    case 3: r = p; g = q; b = v; break;
    case 4: r = t; g = p; b = v; break;
    case 5: r = v; g = p; b = q; break;
  }
  return [(r * 255) | 0, (g * 255) | 0, (b * 255) | 0];
}

function resetDeltaBuffers(sw, sh) {
  deltaPrevFrame = new Uint8Array(sw * sh);
  deltaChangeAge = new Float32Array(sw * sh);
  deltaChangeAge.fill(10.0);
  dustChangeRate = new Float32Array(sw * sh);
  deltaPrevSw = sw;
  deltaPrevSh = sh;
  deltaLastTimestamp = 0;
  captureBaselineFrame(sw, sh);
}

function captureBaselineFrame(sw, sh) {
  const w = video.videoWidth;
  const h = video.videoHeight;
  if (!w || !h) return;
  small.width = sw;
  small.height = sh;
  sctx.drawImage(video, 0, 0, sw, sh);
  const img = sctx.getImageData(0, 0, sw, sh);
  const d = img.data;
  for (let i = 0; i < sw * sh; i++) {
    deltaPrevFrame[i] = (d[i * 4] * 0.299 + d[i * 4 + 1] * 0.587 + d[i * 4 + 2] * 0.114) | 0;
  }
}

function detectChangedBlocks(now, sw, sh) {
  if (!deltaPrevFrame || deltaPrevSw !== sw || deltaPrevSh !== sh) {
    resetDeltaBuffers(sw, sh);
  }

  // Compute delta time, clamped
  let dt = 0;
  if (deltaLastTimestamp > 0) {
    dt = Math.min((now - deltaLastTimestamp) / 1000, 0.1);
  }
  deltaLastTimestamp = now;

  // Read small canvas grayscale and compare
  const sImg = sctx.getImageData(0, 0, sw, sh);
  const sd = sImg.data;
  let anyActive = false;
  const totalDuration = deltaSweepDuration + deltaFadeDuration;

  for (let i = 0; i < sw * sh; i++) {
    const gray = (sd[i * 4] * 0.299 + sd[i * 4 + 1] * 0.587 + sd[i * 4 + 2] * 0.114) | 0;
    const diff = Math.abs(gray - deltaPrevFrame[i]);
    if (diff > 30) {
      deltaChangeAge[i] = 0;
      if (dustChangeRate) dustChangeRate[i] = Math.min(dustChangeRate[i] + 1, 20);
    } else {
      deltaChangeAge[i] += dt;
      if (dustChangeRate) dustChangeRate[i] = Math.max(dustChangeRate[i] - dt * 3, 0);
    }
    deltaPrevFrame[i] = gray;
    if (deltaChangeAge[i] < totalDuration) anyActive = true;
  }

  return anyActive;
}

function applyLingerOverlay(w, h) {
  const bs = Math.max(blockSize, 1);
  const sw = deltaPrevSw;
  const sh = deltaPrevSh;
  if (!sw || !sh || !deltaChangeAge) return;

  const totalDuration = deltaSweepDuration + deltaFadeDuration;

  // Check if anything is active
  let anyActive = false;
  for (let i = 0; i < sw * sh; i++) {
    if (deltaChangeAge[i] < totalDuration) { anyActive = true; break; }
  }
  if (!anyActive) return;

  const imgData = ctx.getImageData(0, 0, w, h);
  const data = imgData.data;

  for (let py = 0; py < h; py++) {
    const by = Math.min((py / bs) | 0, sh - 1);
    for (let px = 0; px < w; px++) {
      const bx = Math.min((px / bs) | 0, sw - 1);
      const bi = by * sw + bx;
      const age = deltaChangeAge[bi];
      if (age >= totalDuration) continue;

      const pi = (py * w + px) * 4;

      let hue, sat, val;
      if (age < deltaSweepDuration) {
        const t = age / deltaSweepDuration;
        hue = deltaHueStart + t * (deltaHueEnd - deltaHueStart);
        sat = 1.0;
        val = 1.0;
      } else {
        hue = deltaHueEnd;
        const fadeProgress = (age - deltaSweepDuration) / deltaFadeDuration;
        sat = 1.0 - fadeProgress;
        val = 1.0 - fadeProgress;
      }

      const rgb = hsvToRgb(hue, sat, val);
      data[pi] = rgb[0];
      data[pi + 1] = rgb[1];
      data[pi + 2] = rgb[2];
    }
  }
  ctx.putImageData(imgData, 0, 0);
}

function dustParticleRender(w, h) {
  if (fwCount <= 0) return;
  const imgData = ctx.getImageData(0, 0, w, h);
  const data = imgData.data;
  for (let i = 0; i < FW_MAX; i++) {
    if (!fwAlive[i]) continue;
    let lifetime;
    switch (fwGen[i]) {
      case 1: lifetime = trailLength; break;
      case 2: lifetime = 0.8; break;
      case 3: lifetime = 1.2; break;
      default: lifetime = 2.0;
    }
    const alpha = 1 - (fwAge[i] / lifetime);
    if (alpha <= 0) continue;
    const cx = Math.round(fwX[i]);
    const cy = Math.round(fwY[i]);
    if (cx < 0 || cx >= w || cy < 0 || cy >= h) continue;
    const rgb = hsvToRgb(fwHue[i], 0.9, 1.0);
    for (let dy = -1; dy <= 1; dy++) {
      const py = cy + dy;
      if (py < 0 || py >= h) continue;
      for (let dx = -1; dx <= 1; dx++) {
        const px = cx + dx;
        if (px < 0 || px >= w) continue;
        const a = (dx === 0 && dy === 0) ? alpha : alpha * 0.4;
        const pi = (py * w + px) * 4;
        data[pi] = data[pi] + (rgb[0] - data[pi]) * a;
        data[pi + 1] = data[pi + 1] + (rgb[1] - data[pi + 1]) * a;
        data[pi + 2] = data[pi + 2] + (rgb[2] - data[pi + 2]) * a;
      }
    }
  }
  ctx.putImageData(imgData, 0, 0);
}

function resetFireworks() {
  fwAlive.fill(0);
  fwGen.fill(0);
  fwSplit.fill(0);
  fwCount = 0;
  fwNextSlot = 0;
}

// ── Trails mode: spawn particles aligned to motion direction ──
function trailsSpawnFromChangedBlocks(w, h, sw, sh) {
  if (!deltaChangeAge) return;
  const bs = Math.max(blockSize, 1);
  const totalDuration = deltaSweepDuration + deltaFadeDuration;
  const maxSpawn = Math.ceil(trailDensity * 1.5);
  let spawned = 0;

  for (let by = 1; by < sh - 1 && spawned < maxSpawn; by++) {
    for (let bx = 1; bx < sw - 1 && spawned < maxSpawn; bx++) {
      const bi = by * sw + bx;
      if (deltaChangeAge[bi] !== 0) continue;
      if (dustChangeRate && dustChangeRate[bi] < 3) continue;

      // Compute motion direction from neighbor change pattern
      let dx = 0, dy = 0;
      if (deltaChangeAge[bi - 1] >= totalDuration) dx -= 1;
      if (deltaChangeAge[bi + 1] >= totalDuration) dx += 1;
      if (deltaChangeAge[bi - sw] >= totalDuration) dy -= 1;
      if (deltaChangeAge[bi + sw] >= totalDuration) dy += 1;
      if (dx === 0 && dy === 0) continue; // not an edge

      const mag = Math.sqrt(dx * dx + dy * dy);
      dx /= mag; dy /= mag;

      const cx = Math.min((bx * bs + bs / 2) | 0, w - 1);
      const cy = Math.min((by * bs + bs / 2) | 0, h - 1);
      const hue = trailHueStart + Math.random() * (trailHueEnd - trailHueStart);
      const speed = trailSpeed * (0.5 + Math.random() * 0.8);

      const slot = fwNextSlot;
      if (fwAlive[slot]) fwCount--;
      fwX[slot] = cx + (Math.random() - 0.5) * bs;
      fwY[slot] = cy + (Math.random() - 0.5) * bs;
      // Velocity aligned to motion direction with some jitter
      const jitter = (Math.random() - 0.5) * 0.6;
      fwVx[slot] = (dx + jitter) * speed;
      fwVy[slot] = (dy + jitter) * speed;
      fwHue[slot] = hue;
      fwAge[slot] = 0;
      fwAlive[slot] = 1;
      fwGen[slot] = 1;
      fwSplit[slot] = 0;
      fwCount++;
      fwNextSlot = (fwNextSlot + 1) % FW_MAX;
      spawned++;
    }
  }
}

function trailsUpdate(dt) {
  for (let i = 0; i < FW_MAX; i++) {
    if (!fwAlive[i] || fwGen[i] !== 1) continue;
    // Gentle drag, no gravity, no branching
    fwVx[i] *= (1 - 0.8 * dt);
    fwVy[i] *= (1 - 0.8 * dt);
    fwX[i] += fwVx[i] * dt;
    fwY[i] += fwVy[i] * dt;
    fwAge[i] += dt;
    if (fwAge[i] >= trailLength) {
      fwAlive[i] = 0;
      fwCount--;
    }
  }
}

// ── Glow mode: heat buffer overlay ──
function glowResetBuffer(sw, sh) {
  glowBuffer = new Float32Array(sw * sh);
  glowPrevSw = sw;
  glowPrevSh = sh;
}

function glowUpdate(sw, sh, dt) {
  if (!glowBuffer || glowPrevSw !== sw || glowPrevSh !== sh) {
    glowResetBuffer(sw, sh);
  }
  if (!deltaChangeAge) return;
  const addRate = glowIntensity / 50;        // 0..2
  const decayRate = 1 - (glowDecay / 100) * dt * 5;  // per frame decay

  for (let i = 0; i < sw * sh; i++) {
    // Add heat where motion detected
    if (deltaChangeAge[i] < 0.05) {
      glowBuffer[i] = Math.min(glowBuffer[i] + addRate * dt * 10, 1.0);
    }
    // Decay
    glowBuffer[i] *= decayRate;
    if (glowBuffer[i] < 0.005) glowBuffer[i] = 0;
  }

  // Spatial blur: average with neighbors for soft glow
  const tmp = new Float32Array(sw * sh);
  for (let y = 0; y < sh; y++) {
    for (let x = 0; x < sw; x++) {
      const i = y * sw + x;
      let sum = glowBuffer[i] * 4;
      let count = 4;
      if (x > 0) { sum += glowBuffer[i - 1]; count++; }
      if (x < sw - 1) { sum += glowBuffer[i + 1]; count++; }
      if (y > 0) { sum += glowBuffer[i - sw]; count++; }
      if (y < sh - 1) { sum += glowBuffer[i + sw]; count++; }
      tmp[i] = sum / count;
    }
  }
  glowBuffer.set(tmp);
}

function glowRender(w, h) {
  if (!glowBuffer) return;
  const sw = glowPrevSw, sh = glowPrevSh;
  if (!sw || !sh) return;

  let anyActive = false;
  for (let i = 0; i < sw * sh; i++) {
    if (glowBuffer[i] > 0.01) { anyActive = true; break; }
  }
  if (!anyActive) return;

  const bs = Math.max(blockSize, 1);
  const imgData = ctx.getImageData(0, 0, w, h);
  const data = imgData.data;

  for (let py = 0; py < h; py++) {
    const by = Math.min((py / bs) | 0, sh - 1);
    for (let px = 0; px < w; px++) {
      const bx = Math.min((px / bs) | 0, sw - 1);
      const heat = glowBuffer[by * sw + bx];
      if (heat < 0.01) continue;

      const t = heat;
      const hue = glowHueStart + t * (glowHueEnd - glowHueStart);
      const rgb = hsvToRgb(hue, 0.9, 1.0);
      const alpha = Math.min(heat * 0.8, 0.85);
      const pi = (py * w + px) * 4;
      data[pi] = data[pi] + (rgb[0] - data[pi]) * alpha;
      data[pi + 1] = data[pi + 1] + (rgb[1] - data[pi + 1]) * alpha;
      data[pi + 2] = data[pi + 2] + (rgb[2] - data[pi + 2]) * alpha;
    }
  }
  ctx.putImageData(imgData, 0, 0);
}

// ── Outline mode: particles that trace edges ──
function outlineSpawnFromEdges(w, h, sw, sh) {
  if (!deltaChangeAge) return;
  const bs = Math.max(blockSize, 1);
  const totalDuration = deltaSweepDuration + deltaFadeDuration;
  const maxSpawn = Math.ceil(outlineDensity * 1.2);
  let spawned = 0;

  for (let by = 1; by < sh - 1 && spawned < maxSpawn; by++) {
    for (let bx = 1; bx < sw - 1 && spawned < maxSpawn; bx++) {
      const bi = by * sw + bx;
      if (deltaChangeAge[bi] !== 0) continue;

      // Find edge normal (direction from changed toward unchanged)
      let nx = 0, ny = 0;
      if (deltaChangeAge[bi - 1] >= totalDuration) nx -= 1;
      if (deltaChangeAge[bi + 1] >= totalDuration) nx += 1;
      if (deltaChangeAge[bi - sw] >= totalDuration) ny -= 1;
      if (deltaChangeAge[bi + sw] >= totalDuration) ny += 1;
      if (nx === 0 && ny === 0) continue; // not an edge

      // Tangent is perpendicular to normal (rotate 90 degrees)
      const tx = -ny, ty = nx;
      const mag = Math.sqrt(tx * tx + ty * ty);

      const cx = Math.min((bx * bs + bs / 2) | 0, w - 1);
      const cy = Math.min((by * bs + bs / 2) | 0, h - 1);
      const hue = outlineHueStart + Math.random() * (outlineHueEnd - outlineHueStart);
      const speed = outlineSpeed * (0.6 + Math.random() * 0.8);
      // Random direction along tangent
      const dir = Math.random() < 0.5 ? 1 : -1;

      const slot = fwNextSlot;
      if (fwAlive[slot]) fwCount--;
      fwX[slot] = cx;
      fwY[slot] = cy;
      fwVx[slot] = (tx / mag) * speed * dir + (Math.random() - 0.5) * 10;
      fwVy[slot] = (ty / mag) * speed * dir + (Math.random() - 0.5) * 10;
      fwHue[slot] = hue;
      fwAge[slot] = 0;
      fwAlive[slot] = 1;
      fwGen[slot] = 2;
      fwSplit[slot] = 0;
      fwCount++;
      fwNextSlot = (fwNextSlot + 1) % FW_MAX;
      spawned++;
    }
  }
}

function outlineUpdate(dt) {
  for (let i = 0; i < FW_MAX; i++) {
    if (!fwAlive[i] || fwGen[i] !== 2) continue;
    // Strong drag to keep particles near edges
    fwVx[i] *= (1 - 2.5 * dt);
    fwVy[i] *= (1 - 2.5 * dt);
    fwX[i] += fwVx[i] * dt;
    fwY[i] += fwVy[i] * dt;
    fwAge[i] += dt;
    if (fwAge[i] >= 0.8) {
      fwAlive[i] = 0;
      fwCount--;
    }
  }
}

// ── Eruptions mode: burst on motion spikes ──
function eruptionsCheck(w, h, sw, sh) {
  if (!deltaChangeAge) return;
  const bs = Math.max(blockSize, 1);

  // Count newly changed blocks this frame
  let changeCount = 0;
  for (let i = 0; i < sw * sh; i++) {
    if (deltaChangeAge[i] < 0.05) changeCount++;
  }

  // Smooth the change rate and detect spikes above the smoothed baseline
  const rawRate = Math.abs(changeCount - prevChangeCount);
  eruptSmoothedRate = eruptSmoothedRate * 0.85 + rawRate * 0.15;
  prevChangeCount = changeCount;

  // Spike = raw rate significantly above smoothed baseline
  const spikeRatio = eruptSmoothedRate > 5 ? rawRate / eruptSmoothedRate : 0;
  const threshold = 1.5 + (eruptThreshold / 100) * 3; // 1.5x to 4.5x baseline

  if (eruptCooldown > 0) { eruptCooldown--; return; }
  if (spikeRatio < threshold || rawRate < 20) return;

  eruptCooldown = 8; // ~8 frames cooldown

  // Spawn bursts FROM the actual changed edge blocks, not a single center
  const totalDuration = deltaSweepDuration + deltaFadeDuration;
  const edges = [];
  for (let by = 0; by < sh; by++) {
    for (let bx = 0; bx < sw; bx++) {
      const bi = by * sw + bx;
      if (deltaChangeAge[bi] !== 0) continue;
      // Check if edge
      let isEdge = (bx === 0 || bx === sw - 1 || by === 0 || by === sh - 1);
      if (!isEdge) {
        if (deltaChangeAge[bi - 1] >= totalDuration ||
            deltaChangeAge[bi + 1] >= totalDuration ||
            deltaChangeAge[bi - sw] >= totalDuration ||
            deltaChangeAge[bi + sw] >= totalDuration) isEdge = true;
      }
      if (isEdge) edges.push(bi);
    }
  }
  if (edges.length === 0) return;

  // Sample edges and spawn small radial bursts from each
  const intensity = Math.min(spikeRatio / threshold, 3);
  const maxPoints = Math.min(edges.length, Math.ceil(eruptSize * intensity / 5));
  const step = edges.length / maxPoints;

  for (let ei = 0; ei < edges.length && fwCount < FW_MAX - 8; ei += step) {
    const bi = edges[ei | 0];
    const bx = bi % sw;
    const by = (bi / sw) | 0;
    const cx = Math.min((bx * bs + bs / 2) | 0, w - 1);
    const cy = Math.min((by * bs + bs / 2) | 0, h - 1);
    const hue = eruptHueStart + Math.random() * (eruptHueEnd - eruptHueStart);
    // Small radial burst (2-4 particles per point)
    const count = 2 + ((Math.random() * 3 * intensity) | 0);
    for (let j = 0; j < count; j++) {
      const slot = fwNextSlot;
      if (fwAlive[slot]) fwCount--;
      const angle = Math.random() * Math.PI * 2;
      const speed = 60 + Math.random() * 180 * intensity;
      fwX[slot] = cx;
      fwY[slot] = cy;
      fwVx[slot] = Math.cos(angle) * speed;
      fwVy[slot] = Math.sin(angle) * speed;
      fwHue[slot] = hue + (Math.random() - 0.5) * 0.05;
      fwAge[slot] = 0;
      fwAlive[slot] = 1;
      fwGen[slot] = 3;
      fwSplit[slot] = 0;
      fwCount++;
      fwNextSlot = (fwNextSlot + 1) % FW_MAX;
    }
  }
}

function eruptionsUpdate(dt) {
  for (let i = 0; i < FW_MAX; i++) {
    if (!fwAlive[i] || fwGen[i] !== 3) continue;
    // Radial explosion: strong outward then gravity pulls down, quick fade
    fwVx[i] *= (1 - 1.5 * dt);
    fwVy[i] *= (1 - 1.5 * dt);
    fwVy[i] += 80 * dt; // gravity
    fwX[i] += fwVx[i] * dt;
    fwY[i] += fwVy[i] * dt;
    fwAge[i] += dt;
    if (fwAge[i] >= 1.2) {
      fwAlive[i] = 0;
      fwCount--;
    }
  }
}

function drawCurrentFrame(now) {
  const w = video.videoWidth;
  const h = video.videoHeight;
  if (!w || !h) return;
  const bs = blockSize;
  const needDetection = deltaEnabled || dustEnabled;
  const bsMax = Math.max(bs, 1);
  const sw = Math.ceil(w / bsMax);
  const sh = Math.ceil(h / bsMax);

  // 1. Draw base frame; also prepare small canvas for change detection
  let smallReady = false;
  if (bs > 1) {
    small.width = sw;
    small.height = sh;
    sctx.drawImage(video, 0, 0, sw, sh);
    smallReady = true;
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(small, 0, 0, w, h);
  } else {
    ctx.drawImage(video, 0, 0, w, h);
  }

  // 2. Draw video to small canvas for change detection (skip if already done above)
  if (needDetection && !smallReady) {
    small.width = sw;
    small.height = sh;
    sctx.drawImage(video, 0, 0, sw, sh);
  }

  // 3. Change detection (shared by linger and fireworks)
  if (needDetection) {
    detectChangedBlocks(now || performance.now(), sw, sh);
  }

  // 5. Linger overlay
  if (deltaEnabled) {
    applyLingerOverlay(w, h);
  }

  // 6. Dust effects (composable — multiple modes can be active)
  if (dustEnabled) {
    let fwDt = 0;
    if (now && fwLastTimestamp > 0) {
      fwDt = Math.min((now - fwLastTimestamp) / 1000, 0.1);
    }
    if (now) fwLastTimestamp = now;

    if (trailsOn) {
      trailsSpawnFromChangedBlocks(w, h, sw, sh);
      trailsUpdate(fwDt);
    }
    if (glowOn) glowUpdate(sw, sh, fwDt);
    if (outlineOn) {
      outlineSpawnFromEdges(w, h, sw, sh);
      outlineUpdate(fwDt);
    }
    if (eruptionsOn) {
      eruptionsCheck(w, h, sw, sh);
      eruptionsUpdate(fwDt);
    }

    if (glowOn) glowRender(w, h);
    if (fwCount > 0) dustParticleRender(w, h);
  }

  // Final: apply blur to entire composited frame
  if (blurRadius > 0) {
    ctx.filter = `blur(${blurRadius}px)`;
    ctx.drawImage(canvas, 0, 0);
    ctx.filter = 'none';
  }
}

video.addEventListener('loadedmetadata', () => {
  document.getElementById('spinner').remove();

  canvas.height = video.videoHeight;
  const maxW = window.innerWidth * 0.9;

  const displayH = displayW * video.videoHeight / video.videoWidth;
  canvas.style.width = displayW + 'px';
  canvas.style.height = displayH + 'px';

});

});

// Scrub bar — fully custom pointer handling (bypasses native range step behavior)
let pointerScrubbing = false;

function seekToScrubPosition() {
  if (!video.duration) return;
  video.currentTime = (scrub.value / 1000) * video.duration;
  if (deltaEnabled || dustEnabled) {
    const bs = Math.max(blockSize, 1);
    const sw = Math.ceil(video.videoWidth / bs);
    const sh = Math.ceil(video.videoHeight / bs);
    if (sw > 0 && sh > 0) resetDeltaBuffers(sw, sh);
  }
  resetFireworks();
  if (glowBuffer) glowBuffer.fill(0);
  prevChangeCount = 0;
  drawCurrentFrame();
  updateTime();
}

function scrubFromPointer(e) {
  const rect = scrub.getBoundingClientRect();
  const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  scrub.value = Math.round(pct * 1000);
  seekToScrubPosition();
}

scrub.addEventListener('pointerdown', (e) => {
  isScrubbing = true;
  pointerScrubbing = true;
  scrubFromPointer(e);
  const onMove = (e2) => scrubFromPointer(e2);
  const onUp = () => {
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    pointerScrubbing = false;
    isScrubbing = false;
    updateTime();
  };
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
});

// Keyboard accessibility (arrow keys) — only when not pointer-scrubbing
scrub.addEventListener('input', () => {
  if (pointerScrubbing) return;
  seekToScrubPosition();
});

  if (cfg.tl != null) { document.getElementById('trailLength').value = cfg.tl; trailLength = cfg.tl / 100; }
  if (cfg.ts != null) { document.getElementById('trailSpeed').value = cfg.ts; trailSpeed = cfg.ts; }
  if (cfg.td != null) { document.getElementById('trailDensity').value = cfg.td; trailDensity = cfg.td; }
  if (cfg.tc1 != null) { document.getElementById('trailColorStart').value = cfg.tc1; trailHueStart = hexToHue(cfg.tc1); }
  if (cfg.tc2 != null) { document.getElementById('trailColorEnd').value = cfg.tc2; trailHueEnd = hexToHue(cfg.tc2); }
  if (cfg.gi != null) { document.getElementById('glowIntensity').value = cfg.gi; glowIntensity = cfg.gi; }
  if (cfg.gd != null) { document.getElementById('glowDecay').value = cfg.gd; glowDecay = cfg.gd; }
  if (cfg.gc1 != null) { document.getElementById('glowColorStart').value = cfg.gc1; glowHueStart = hexToHue(cfg.gc1); }
  if (cfg.gc2 != null) { document.getElementById('glowColorEnd').value = cfg.gc2; glowHueEnd = hexToHue(cfg.gc2); }
  if (cfg.os != null) { document.getElementById('outlineSpeed').value = cfg.os; outlineSpeed = cfg.os; }
  if (cfg.od != null) { document.getElementById('outlineDensity').value = cfg.od; outlineDensity = cfg.od; }
  if (cfg.oc1 != null) { document.getElementById('outlineColorStart').value = cfg.oc1; outlineHueStart = hexToHue(cfg.oc1); }
  if (cfg.oc2 != null) { document.getElementById('outlineColorEnd').value = cfg.oc2; outlineHueEnd = hexToHue(cfg.oc2); }
  if (cfg.et != null) { document.getElementById('eruptThreshold').value = cfg.et; eruptThreshold = cfg.et; }
  if (cfg.eb != null) { document.getElementById('eruptSize').value = cfg.eb; eruptSize = cfg.eb; }
  if (cfg.ec1 != null) { document.getElementById('eruptColorStart').value = cfg.ec1; eruptHueStart = hexToHue(cfg.ec1); }
  if (cfg.ec2 != null) { document.getElementById('eruptColorEnd').value = cfg.ec2; eruptHueEnd = hexToHue(cfg.ec2); }
}

function loadConfigFromURL() {
  const hash = location.hash.slice(1);
  if (!hash.startsWith('cfg=')) return;
  try {
    const cfg = JSON.parse(atob(hash.slice(4)));
    applyConfig(cfg);
  } catch (e) { /* ignore malformed */ }
}

document.getElementById('shareBtn').addEventListener('click', () => {
  const cfg = getConfig();
  const encoded = btoa(JSON.stringify(cfg));
  location.hash = 'cfg=' + encoded;
  const url = location.href;
  navigator.clipboard.writeText(url).then(() => {
    const btn = document.getElementById('shareBtn');
    btn.textContent = 'Copied!';
    setTimeout(() => { btn.textContent = 'Share'; }, 1500);
  });
});

loadConfigFromURL();

// Auto-load on page open
loadVideo();
</script>
